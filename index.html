    g.lineWidth = .4 + rnd() * .9;
    g.beginPath(); g.moveTo(x, y);
    g.quadraticCurveTo(x + Math.cos(a + bend) * len * .5, y + Math.sin(a + bend) * len * .5, x + Math.cos(a) * len, y + Math.sin(a) * len);
    g.stroke();
  }
  g.fillStyle = 'rgba(110,94,70,.13)';
  for (let i = 0; i < 700; i++) g.fillRect(rnd() * W, rnd() * H, .6 + rnd() * 1.2, .6 + rnd() * 1.2);
}
/* Siyah dünya: döşenebilir (kenarları birleşen) gürültü dokusu; CSS ile çok yavaş kaydırılır, kare başına maliyeti yok */
function makeSmoke() {
  const n = 512, v = new Float32Array(n * n), rnd = mulberry32(31);
  for (const [cells, wgt] of [[3, .5], [6, .27], [12, .15], [24, .08]]) {
    const grid = Float32Array.from({ length: cells * cells }, () => rnd());
    for (let y = 0; y < n; y++) for (let x = 0; x < n; x++) {
      const fx = x / n * cells, fy = y / n * cells, ix = fx | 0, iy = fy | 0;
      const tx = smooth(0, 1, fx - ix), ty = smooth(0, 1, fy - iy), jx = (ix + 1) % cells, jy = (iy + 1) % cells;
      const a = grid[iy * cells + ix], b = grid[iy * cells + jx], c = grid[jy * cells + ix], d = grid[jy * cells + jx];
      v[y * n + x] += wgt * (a + (b - a) * tx + (c - a) * ty + (a - b - c + d) * tx * ty);
    }
  }
  const c = mkCanvas(n, n), g = c.getContext('2d'), id = g.createImageData(n, n);
  for (let i = 0; i < n * n; i++) {
    id.data[i * 4] = id.data[i * 4 + 1] = id.data[i * 4 + 2] = 255;
    id.data[i * 4 + 3] = 255 * smooth(.42, .78, v[i]);
  }
  g.putImageData(id, 0, 0);
  const url = `url(${c.toDataURL()})`;
  document.querySelectorAll('.smoke').forEach(el => { el.style.backgroundImage = url; });
}
/* Ensō: fırçayla çizilmiş gibi açık uçlu çember. Kalınlık değişken (dolgun başlar, kuruyarak incelir);
   maske üzerindeki çizgi dashoffset ile ilerletilerek "fırça hızıyla" çizilir. */
const Enso = {
  masks: [], uid: 0,
  markup(N, seed, offset) {
    const cx = 20, cy = 20, a0 = -1.15, sweep = 5.7, out = [], inn = [], mid = [], hair = [], id = 'ensoMask' + (++this.uid);
    for (let i = 0; i <= N; i++) {
      const u = i / N, a = a0 + sweep * u, r = 13.2 + .55 * Math.sin(u * 6.3 + seed * 2);
      const hw = (.38 + 2.5 * Math.pow(1 - u, 1.35)) * Math.min(1, .45 + u / .06), c = Math.cos(a), s = Math.sin(a);
      out.push(`${(cx + c * (r + hw)).toFixed(2)} ${(cy + s * (r + hw)).toFixed(2)}`);
      inn.unshift(`${(cx + c * (r - hw)).toFixed(2)} ${(cy + s * (r - hw)).toFixed(2)}`);
      mid.push(`${(cx + c * r).toFixed(2)} ${(cy + s * r).toFixed(2)}`);
      if (u > .42 && u < .93) hair.push(`${(cx + c * (r + hw + 1.1)).toFixed(2)} ${(cy + s * (r + hw + 1.1)).toFixed(2)}`);
    }
    return `<mask id="${id}" maskUnits="userSpaceOnUse" x="-4" y="-4" width="48" height="48">` +
      `<path d="M${mid.join('L')}" pathLength="1" fill="none" stroke="#fff" stroke-width="11" stroke-dasharray="1 1" stroke-dashoffset="${offset}"/></mask>` +
      `<g mask="url(#${id})"><path d="M${out.join('L')}L${inn.join('L')}Z" fill="currentColor"/>` +
      `<path d="M${hair.join('L')}" fill="none" stroke="currentColor" stroke-width=".45"/></g>`;
  },
  // Üst/alt satırdaki küçük ensōlar: her sayfa değişiminde yeniden çizilir
  init() {
    document.querySelectorAll('.bar .enso').forEach((el, i) => { el.innerHTML = this.markup(56, i, 1); this.masks.push(el.querySelector('mask path')); });
  },
  draw() {
    gsap.fromTo(this.masks, { attr: { 'stroke-dashoffset': 1 } },
      { attr: { 'stroke-dashoffset': 0 }, duration: .9, ease: 'power3.out', stagger: .14, overwrite: true });
  }
};

/* Fırça rakamlar: her rakam bir ya da iki fırça darbesinin orta çizgisiyle tanımlıdır (100x140 kutu).
   Orta çizgi örneklenir, ensōdaki gibi değişken kalınlıklı bir dış hat üretilir; her darbenin kendi
   maskesi vardır, böylece rakam darbe darbe "yazılır". Kenar pürüzü: #rough filtresi. */
const DIGITS = {
  0: ['M52 14C24 14 16 50 16 74C16 104 30 128 52 128C76 128 86 100 86 70C86 42 76 14 50 14'],
  1: ['M28 40C40 34 50 26 57 12L55 128'],
  2: ['M20 42C22 22 38 12 54 12C72 12 84 24 84 40C84 62 50 86 18 124C40 120 64 122 90 126'],
  3: ['M20 26C32 14 48 12 58 12C74 12 84 22 84 36C84 54 66 64 46 66C68 66 88 76 88 96C88 116 70 128 52 128C36 128 22 122 14 108'],
  4: ['M64 12L14 94L92 92', 'M66 44L64 130'],
  5: ['M32 14L24 64C34 56 46 52 56 52C76 52 88 68 88 88C88 112 70 128 50 128C34 128 22 120 14 108', 'M30 16L82 13'],
  6: ['M76 16C48 22 20 52 18 90C18 114 32 128 52 128C72 128 86 114 86 94C86 74 72 62 54 62C38 62 24 72 18 90'],
  7: ['M16 18L86 15C66 48 48 84 42 130'],
  8: ['M52 66C32 60 24 48 24 38C24 22 36 12 52 12C68 12 80 22 80 38C80 50 70 60 52 66C30 72 18 86 18 100C18 116 32 128 52 128C72 128 86 116 86 100C86 86 74 72 52 66'],
  9: ['M84 50C80 68 66 78 50 78C32 78 18 64 18 46C18 26 32 12 50 12C70 12 84 26 84 50C84 90 68 118 30 128']
};
const SVGNS = 'http://www.w3.org/2000/svg';
const Brush = {
  uid: 0, cache: {},
  geometry(d, wid, seed) {
    const probe = $('#probe');
    probe.setAttribute('d', d);
    const len = probe.getTotalLength(), n = Math.max(10, Math.ceil(len / 2.4)), P = [], out = [], inn = [], mid = [], hair = [];
    for (let i = 0; i <= n; i++) { const q = probe.getPointAtLength(len * i / n); P.push(q.x, q.y); }
    for (let i = 0; i <= n; i++) {
      const a = Math.max(0, i - 3), b = Math.min(n, i + 3), u = i / n, x = P[i * 2], y = P[i * 2 + 1];
      let tx = P[b * 2] - P[a * 2], ty = P[b * 2 + 1] - P[a * 2 + 1];
      const l = Math.hypot(tx, ty) || 1;
      tx /= l; ty /= l;
      // dolgun başlar, kuruyarak incelir; hafif titreme
      const hw = wid * (.44 + .76 * Math.pow(1 - u, 1.25)) * Math.min(1, .4 + u / .05) * (1 + .09 * Math.sin(u * 15 + seed));
      out.push(`${(x - ty * hw).toFixed(1)} ${(y + tx * hw).toFixed(1)}`);
      inn.unshift(`${(x + ty * hw).toFixed(1)} ${(y - tx * hw).toFixed(1)}`);
      mid.push(`${x.toFixed(1)} ${y.toFixed(1)}`);
      if (u > .4 && u < .94) hair.push(`${(x - ty * (hw + wid * .32)).toFixed(1)} ${(y + tx * (hw + wid * .32)).toFixed(1)}`);
    }
    return { out: `M${out.join('L')}L${inn.join('L')}Z`, mid: 'M' + mid.join('L'), hair: hair.length > 1 ? 'M' + hair.join('L') : '' };
  },
  stroke(d, wid, seed) {
    const c = this.cache[d] || (this.cache[d] = this.geometry(d, wid, seed)), id = 'brushMask' + (++this.uid);
    return `<mask id="${id}" maskUnits="userSpaceOnUse" x="-40" y="-40" width="220" height="240">` +
      `<path d="${c.mid}" pathLength="1" fill="none" stroke="#fff" stroke-width="${(wid * 3.6).toFixed(1)}" stroke-dasharray="1 1" stroke-dashoffset="0"/></mask>` +
      `<g mask="url(#${id})"><path d="${c.out}" fill="currentColor"/><path d="${c.hair}" fill="none" stroke="currentColor" stroke-width="${(wid * .12).toFixed(2)}"/></g>`;
  },
  number(value, cls) {
    const str = String(value), adv = 94, svg = document.createElementNS(SVGNS, 'svg');
    svg.setAttribute('viewBox', `0 0 ${adv * (str.length - 1) + 100} 140`);
    svg.setAttribute('class', 'brush ' + (cls || ''));
    svg.innerHTML = '<g filter="url(#rough)">' + [...str].map((ch, i) =>
      `<g transform="translate(${i * adv} 0)">${(DIGITS[ch] || []).map((d, k) => this.stroke(d, 7.5, i * 3 + k)).join('')}</g>`).join('') + '</g>';
    return svg;
  },
  /* Sumi ensō: tek bir fırça darbesi, onlarca "kıl"dan oluşur. Her kıl kendi mürekkebini taşır:
     başta hepsi dolu olduğundan darbe dolgundur; ilerledikçe kıllar öbek öbek kurur, darbe incelir,
     kenarları kırılır ve ucu açık kalır. Maske, darbeyi fırça hızıyla açar. */
  sumi(cls) {
    const svg = document.createElementNS(SVGNS, 'svg'), id = 'ensoMask' + (++Enso.uid), rnd = mulberry32(11);
    const N = 170, M = 40, cx = 20, cy = 20, a0 = -1.3, sweep = 5.72, mid = [];
    const rad = u => 13.3 + .55 * Math.sin(u * 5.1 + 1), half = u => (.42 + 2.75 * Math.pow(1 - u, 1.15)) * Math.min(1, .2 + u / .03);
    let out = '';
    for (let i = 0; i <= N; i++) {
      const u = i / N, a = a0 + sweep * u;
      mid.push(`${(cx + Math.cos(a) * rad(u)).toFixed(2)} ${(cy + Math.sin(a) * rad(u)).toFixed(2)}`);
    }
    for (let j = 0; j < M; j++) {
      const o = (j + .5) / M * 2 - 1, start = .34 + .4 * rnd() - .2 * Math.abs(o);     // kenar kılları daha erken kurur
      let d = '', pen = false;
      for (let i = 0; i <= N; i++) {
        const u = i / N, a = a0 + sweep * u, dry = smooth(start, 1.3, u);
        // mürekkep: kıllar arasında yavaş değişen gürültü → komşu kıllar birlikte kurur (şerit şerit boşluk)
        const ink = .5 + .5 * (.75 * Noise(u * 7, o * 2.6, 3) + .25 * Noise(u * 26, o * 9, 5));
        if (ink > dry * .98 - .02) {
          const r = rad(u) + o * half(u) + .07 * Noise(u * 16, j * .8, 7);
          d += (pen ? 'L' : 'M') + (cx + Math.cos(a) * r).toFixed(2) + ' ' + (cy + Math.sin(a) * r).toFixed(2);
          pen = true;
        } else pen = false;
      }
      if (d) out += `<path d="${d}" stroke-width="${(.2 + .16 * rnd()).toFixed(2)}" opacity="${(.5 + .5 * rnd()).toFixed(2)}"/>`;
    }
    for (let k = 0; k < 9; k++) {                        // fırçanın kâğıda ilk değdiği yerde sıçrayan damlalar
      const a = a0 - .12 + rnd() * .4, r = rad(0) + (rnd() - .5) * 8.5;
      out += `<circle cx="${(cx + Math.cos(a) * r).toFixed(2)}" cy="${(cy + Math.sin(a) * r).toFixed(2)}" r="${(.05 + .16 * rnd() * rnd()).toFixed(2)}" fill="currentColor" stroke="none"/>`;
    }
    svg.setAttribute('viewBox', '0 0 40 40');
    svg.setAttribute('class', 'brush ' + (cls || ''));
    svg.innerHTML = `<mask id="${id}" maskUnits="userSpaceOnUse" x="-4" y="-4" width="48" height="48">` +
      `<path d="M${mid.join('L')}" pathLength="1" fill="none" stroke="#fff" stroke-width="13" stroke-dasharray="1 1" stroke-dashoffset="0"/></mask>` +
      `<g mask="url(#${id})" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round">${out}</g>`;
    return svg;
  },
  // Darbeler sırayla, fırça hızıyla çizilir
  draw(svg, dur = .6, delay = 0, ease = 'power2.out') {
    return gsap.fromTo(svg.querySelectorAll('mask path'), { attr: { 'stroke-dashoffset': 1 } },
      { attr: { 'stroke-dashoffset': 0 }, duration: dur, stagger: dur * .7, ease, delay });
  }
};

/* =====================================================================
   6) GÖRSELLER — dosyayı yükle, beyaz pikselleri şeffaf yap (eşik), beyaz ve siyah
      kopyalarını üret; silüetlerde rüzgâr altı kenar noktalarını çıkar.
      Sıra: dosya → (piksel okunamıyorsa ya da dosya yoksa) gömülü kopya → yedek çizim.
      Not: sayfa file:// ile açıldığında tarayıcı diskteki görselin piksellerini
      okutmaz; bu durumda embedded.js'teki kopya kullanılır
      (yeni görsel ekleyince: python tools/embed_silhouettes.py).
   ===================================================================== */
const SPRITES = {};
const FILES = window.SILHOUETTE_FILES || {}, EMBEDDED = window.SILHOUETTE_DATA || {};

function processSource(src, sw, sh, wantEdges) {
  const cfg = CONFIG.sprite, k = Math.min(1, cfg.maxH / sh);
  const w = Math.max(1, Math.round(sw * k)), h = Math.max(1, Math.round(sh * k));
  const c = mkCanvas(w, h), g = c.getContext('2d', { willReadFrequently: true });
  g.fillStyle = '#fff'; g.fillRect(0, 0, w, h);
  g.drawImage(src, 0, 0, w, h);
  const p = g.getImageData(0, 0, w, h).data;           // file:// altında SecurityError fırlatır
  const A = new Uint8ClampedArray(w * h), lo = cfg.lumaLo, hi = cfg.lumaHi;
  let x0 = w, y0 = h, x1 = -1, y1 = -1;
  for (let y = 0, i = 0; y < h; y++) for (let x = 0; x < w; x++, i++) {
    const l = .299 * p[i * 4] + .587 * p[i * 4 + 1] + .114 * p[i * 4 + 2];
    const a = l <= lo ? 255 : l >= hi ? 0 : 255 * (hi - l) / (hi - lo);
    A[i] = a;
    if (a > 127) { if (x < x0) x0 = x; if (x > x1) x1 = x; if (y < y0) y0 = y; if (y > y1) y1 = y; }
  }
  if (x1 < 0) throw new Error('boş görsel');
  const bw = x1 - x0 + 1, bh = y1 - y0 + 1;
  const paint = v => {                                  // sınır kutusuna kırpılmış, tek renkli kopya
    const o = mkCanvas(bw, bh), og = o.getContext('2d'), id = og.createImageData(bw, bh), q = id.data;
    for (let y = 0, j = 0; y < bh; y++) for (let x = 0; x < bw; x++, j += 4) {
      q[j] = q[j + 1] = q[j + 2] = v; q[j + 3] = A[(y + y0) * w + x + x0];
    }
    og.putImageData(id, 0, 0);
    return o;
  };
  const sp = { white: paint(255), black: paint(0), w: bw, h: bh, aspect: bw / bh, edgesR: [], edgesL: [], rootY: .5 };
  // Dalın kökü: sol kenardaki dolu piksellerin ortalama yüksekliği
  let ry = 0, rn = 0;
  for (let y = y0; y <= y1; y++) if (A[y * w + x0 + 2] > 127) { ry += y - y0; rn++; }
  if (rn) sp.rootY = ry / rn / bh;
  if (wantEdges) {
    // Rüzgâr altı kenarlar: sağında (yeterince geniş) boşluk olan figür kenarları. Kol-gövde arası gibi
    // dar aralıklar sayılmaz; böylece izler yalnızca figürün açık havaya bakan kenarından doğar.
    // edgesL, figür yatay çevrildiğinde kullanılır.
    const minGap = .07 * bh;
    for (let y = y0; y <= y1; y += 2) {
      let prevEnd = -1e9, x = x0;
      while (x <= x1) {
        if (A[y * w + x] <= 127) { x++; continue; }
        let e = x;
        while (e < x1 && A[y * w + e + 1] > 127) e++;
        let nx = e + 1;
        while (nx <= x1 && A[y * w + nx] <= 127) nx++;
        if (nx > x1 || nx - e - 1 >= minGap) sp.edgesR.push((e - x0 + 1) / bw, (y - y0) / bh);
        if (x - prevEnd - 1 >= minGap) sp.edgesL.push(1 - (x - x0) / bw, (y - y0) / bh);
        prevEnd = e; x = e + 1;
      }
    }
  }
  return sp;
}

function loadImage(url) {
  return new Promise((ok, fail) => { const im = new Image(); im.onload = () => ok(im); im.onerror = fail; im.src = url; });
}
/* names: aynı görsel için kabul edilen dosya adları (ilk bulunan kullanılır) */
async function loadSprite(names, dir, fallback, wantEdges) {
  names = [].concat(names);
  for (const n of names) {
    const urls = FILES[n] ? [FILES[n]] : CONFIG.sprite.ext.map(e => `${dir}${n}.${e}`);
    for (const u of [...urls, EMBEDDED[n]]) {
      if (!u) continue;
      try { const im = await loadImage(u); return processSource(im, im.naturalWidth, im.naturalHeight, wantEdges); }
      catch (e) { /* dosya yok ya da pikseli okunamıyor: sıradakini dene */ }
    }
  }
  console.warn(`Görsel yüklenemedi, yedek çizim kullanılıyor: ${names[0]}`);
  const fb = fallback(names[0]);
  return processSource(fb, fb.width, fb.height, wantEdges);
}

/* --- Yedek çizimler (dosya yoksa) --- */
function blank(w, h) { const c = mkCanvas(w, h), g = c.getContext('2d'); g.fillStyle = '#fff'; g.fillRect(0, 0, w, h); g.fillStyle = g.strokeStyle = '#000'; return [c, g]; }
function fallbackFigure(name) {
  const [c, g] = blank(900, 600);
  const person = (cx, hgt) => {
    const b = 580, u = hgt / 100;
    g.beginPath(); g.arc(cx, b - 90 * u, 9 * u, 0, TAU); g.fill();
    g.beginPath(); g.roundRect(cx - 13 * u, b - 79 * u, 26 * u, 40 * u, 9 * u); g.fill();
    g.fillRect(cx - 11 * u, b - 44 * u, 9.5 * u, 44 * u);
    g.fillRect(cx + 1.5 * u, b - 44 * u, 9.5 * u, 44 * u);
  };
  if (/crowd|kalabal/i.test(name)) [70, 190, 310, 430, 550, 670, 790].forEach((x, i) => person(x, 380 + (i * 37 % 60)));
  else if (/hands|pair|iki/i.test(name)) { person(330, 540); person(570, 520); g.fillRect(340, 300, 220, 22); }
  else person(450, 540);
  return c;
}
/* SVG yol tanımlarıyla basit yaprak şekilleri */
const LEAF_PATHS = {
  maple: 'M100 196 L98 132 L52 164 L72 122 L8 128 L62 96 L22 44 L80 78 L100 6 L120 78 L178 44 L138 96 L192 128 L128 122 L148 164 L102 132 Z',
  gingko: 'M100 196 C98 160 96 140 92 122 C60 112 26 100 14 70 C30 44 62 26 96 22 L100 62 L104 22 C138 26 170 44 186 70 C174 100 140 112 108 122 C104 140 103 160 104 196 Z',
  bamboo: 'M92 8 C120 60 132 120 112 176 L118 196 L108 178 C80 130 78 70 92 8 Z'
};
function fallbackLeaf(name) {
  const [c, g] = blank(200, 200);
  g.fill(new Path2D(LEAF_PATHS[/maple|momiji/.test(name) ? 'maple' : /gin/.test(name) ? 'gingko' : 'bamboo']));
  return c;
}
function fallbackBranch() {                             // kökü solda, sağa-aşağı uzanan çam dalı
  const [c, g] = blank(760, 420), rnd = mulberry32(5);
  g.lineCap = 'round';
  const bough = t => [760 * t, 60 + 250 * t * t - 40 * Math.sin(t * 3)];
  for (let i = 0; i < 40; i++) {
    const [x, y] = bough(i / 40), [x2, y2] = bough((i + 1) / 40);
    g.lineWidth = 16 - 13 * i / 40; g.beginPath(); g.moveTo(x, y); g.lineTo(x2, y2); g.stroke();
  }
  const tuft = (x, y, dir) => {
    g.lineWidth = 1.3;
    for (let i = 0; i < 22; i++) {
      const a = dir + (rnd() - .5) * 2.4, l = 34 + rnd() * 26;
      g.beginPath(); g.moveTo(x, y); g.lineTo(x + Math.cos(a) * l, y + Math.sin(a) * l); g.stroke();
    }
  };
  for (let i = 2; i <= 10; i++) {
    const [x, y] = bough(i / 10), dir = (i % 2 ? -1 : 1) * (.9 + rnd() * .5) + .3, l = 50 + rnd() * 50;
    const tx = x + Math.cos(dir) * l, ty = y + Math.sin(dir) * l;
    g.lineWidth = 3.2; g.beginPath(); g.moveTo(x, y); g.lineTo(tx, ty); g.stroke();
    tuft(tx, ty, dir); tuft((x + tx) / 2, (y + ty) / 2, dir - .4);
  }
  return c;
}

const LEAF_SPRITES = [];    // { white: [keskin, hafif bulanık, bulanık], black: [...], fw, fh }
let BRANCH_SPRITE = null;
/* Tüm sayfaların silüetleri baştan yüklenir: sayfa geçişinde bekleme olmaz */
/* Instagram ekran görüntüleri: CONFIG.instagram.shots, uzantılar sırayla denenerek aranır.
   İlk görsel yoksa konsola yazılır ve sayfa ensō yedeğini gösterir. */
const IG = { shots: [] };                               // [{ src, w, h }]
async function findImage(base) {
  const urls = /\.\w{3,4}$/.test(base) ? [base] : CONFIG.instagram.ext.map(e => `${base}.${e}`);
  for (const u of urls) { try { const im = await loadImage(encodeURI(u)); return { src: u, w: im.naturalWidth, h: im.naturalHeight }; } catch (e) { /* sıradaki uzantı */ } }
  return null;
}
async function loadInstagram() {
  const c = CONFIG.instagram, dir = 'assets/instagram/';
  const found = await Promise.all(c.shots.map(n => findImage(n.includes('/') ? n : dir + n)));
  if (!found[0]) console.warn(`Instagram ekran görüntüsü bulunamadı: ${dir}${c.shots[0]} — denenen uzantılar: ${c.ext.join(', ')}`);
  IG.shots = found[0] ? found.filter(Boolean) : [];
}

async function loadAssets(scene) {
  const figs = new Set();
  for (const s of SLIDES) {
    (s.silhouettes || []).forEach(o => figs.add(o.src));
    (s.crowds || []).forEach(c => c.sprites.forEach(n => figs.add(n)));
  }
  const jobs = [...figs].map(async n => { SPRITES[n] = await loadSprite(n, 'assets/silhouettes/', fallbackFigure, true); });
  if (scene) CONFIG.leaves.names.forEach((names, i) => jobs.push((async () => {
    const sp = await loadSprite(names, 'assets/nature/', fallbackLeaf, false);
    // Yapraklar küçük çizildiği için küçültülmüş kopyalar; derinlik için önceden bulanıklaştırılmış sürümler
    const k = 96 / Math.max(sp.w, sp.h), w = Math.ceil(sp.w * k) + 12, h = Math.ceil(sp.h * k) + 12;
    const variants = src => [0, 1.3, 2.8].map(b => {
      const c = mkCanvas(w, h), g = c.getContext('2d');
      if (b && 'filter' in g) g.filter = `blur(${b}px)`;
      g.drawImage(src, 6, 6, w - 12, h - 12);
      return c;
    });
    const m = Math.max(w, h);
    LEAF_SPRITES[i] = { white: variants(sp.white), black: variants(sp.black), fw: w / m, fh: h / m };
  })()));
  if (scene) jobs.push((async () => { BRANCH_SPRITE = await loadSprite(CONFIG.branch.names, 'assets/nature/', fallbackBranch, false); })());
  if (scene) jobs.push((async () => { BONSAI_SPRITE = await loadSprite(CONFIG.bonsai.names, 'assets/nature/', fallbackBonsai, false); })());
  if (SLIDES.some(s => s.type === 'instagram')) jobs.push(loadInstagram());
  await Promise.all(jobs);
}

/* =====================================================================
   7) SAHNE KURULUMU — sayfa verisinden figür listesi
      silhouettes : tek tek yerleştirilen silüetler { src, x (merkez), y (ayak hizası), scale | h, flip, layer }
      crowds      : ufuk çizgisi boyunca otomatik dizilen sıra
      horizons    : ince zemin çizgisi
      layer "white" → beyaz katman (siyah zemin), "black" → siyah katman (beyaz zemin)
   ===================================================================== */
function makeFigure(o) {
  const sp = SPRITES[o.src], h = Math.round(o.h || (o.scale || .4) * H);
  // mode: 'in' rüzgârın içinden geliyor | 'on' yerinde | 'out' rüzgârla dağılıyor;  p: 0 dağınık … 1 bütün
  return { sp, x: o.x, y: Math.round(o.y), h, w: h * sp.aspect, flip: !!o.flip, ph: rand(TAU), amp: 0, seed: rand(100), mode: 'on', p: 1 };
}
function crowdFigures(cr) {
  const rnd = mulberry32(cr.seed || 1), row = [];
  let x = cr.from;
  for (let i = 0; i < 200; i++) {
    const src = cr.sprites[(rnd() * cr.sprites.length) | 0];
    const h = cr.h[0] + rnd() * (cr.h[1] - cr.h[0]), w = h * SPRITES[src].aspect;
    if (x + w > cr.to) break;
    row.push({ src, x: x + w / 2, y: cr.y, h });
    x += w + cr.gap[0] + rnd() * (cr.gap[1] - cr.gap[0]);
  }
  const last = row[row.length - 1];
  const shift = last ? (cr.to - (last.x + last.h * SPRITES[last.src].aspect / 2)) / 2 : 0;   // sırayı ortala
  return row.map(o => { o.x += shift; return makeFigure(o); });
}
function sceneFor(s, key) {
  const def = s.world === 'light' ? 'black' : 'white', mine = o => (o.layer || def) === key;
  const figs = (s.silhouettes || []).filter(o => mine(o) && SPRITES[o.src]).map(makeFigure);
  (s.crowds || []).filter(mine).forEach(cr => figs.push(...crowdFigures(cr)));
  return { figs, lines: (s.horizons || []).filter(mine) };
}

/* =====================================================================
   8) RÜZGÂR ALANI — tüm hareketin tek kaynağı.
      akış = soldan sağa ana yön × şiddet  +  curl gürültüsü (zamanla değişen girdaplar)
      şiddet = sakin taban + yavaş soluk + esinti zarfı (4–8 sn'de bir, soldan sağa süpüren cephe)
   ===================================================================== */
const Wind = {
  t: 0, gusts: [], next: 1.2,
  update(dt) {
    const c = CONFIG.wind;
    this.t += dt;
    if (this.t >= this.next) {
      this.gusts.push({ t0: this.t, dur: rand(...c.gustDur), amp: rand(...c.gustAmp) });
      this.next = this.t + rand(...c.gustEvery);
    }
    while (this.gusts.length && this.t - this.gusts[0].t0 > this.gusts[0].dur + 3) this.gusts.shift();
  },
  gust(x) {                                             // 0…1: o noktadaki anlık esinti
    let v = 0;
    for (const q of this.gusts) {
      const u = (this.t - q.t0 - (x + 300) / CONFIG.wind.front) / q.dur;
      if (u > 0 && u < 1) { const s = Math.sin(Math.PI * u); v = Math.max(v, q.amp * s * s); }
    }
    return v;
  },
  strength(x) {
    const c = CONFIG.wind;
    return c.calm + c.breath * (.5 + .5 * Noise(this.t * .11, 3.7, x * .0004)) + c.gust * this.gust(x);
  },
  sample(x, y, out) {                                   // out = hız (px/sn); dönen değer = şiddet
    const c = CONFIG.wind, s = this.strength(x), e = .04;
    const nx = x * c.curlScale, ny = y * c.curlScale * 1.35, nz = this.t * c.curlRate, n0 = Noise(nx, ny, nz);
    const k = c.curl * (.55 + .6 * s);
    out.x = c.speed * s + (Noise(nx, ny + e, nz) - n0) / e * k;
    out.y = -(Noise(nx + e, ny, nz) - n0) / e * k;
    return s;
  }
};
const V = { x: 0, y: 0 };

/* =====================================================================
   9) FIRÇA İZLERİ — her iz, rüzgâr alanında taşınan bir parçacığın geçmiş
      noktalarından oluşan şerittir (ribbon). Kalınlık ve opaklık uçlarda sıfıra iner.
   ===================================================================== */
const RN = 64, STEP = .05;                              // şerit başına en çok nokta; nokta ekleme aralığı (sn)
const UX = new Float32Array(RN), UY = new Float32Array(RN), HW = new Float32Array(RN);
function newRibbon() {
  return { xs: new Float32Array(RN), ys: new Float32Array(RN), n: 0, max: 40, acc: 0, age: 0, life: 1,
           wid: 1, alpha: 1, k: 1, dead: true, wait: rand(0, 3) };
}
function startRibbon(r, x, y) {
  r.xs[0] = r.xs[1] = x; r.ys[0] = r.ys[1] = y;
  r.n = 2; r.acc = 0; r.age = 0; r.dead = false;
}
function stepRibbon(r, dt) {
  r.age += dt;
  if (r.age >= r.life) { r.dead = true; return; }
  const h = r.n - 1;
  let x = r.xs[h], y = r.ys[h];
  Wind.sample(x, y, V);
  x += V.x * r.k * dt; y += V.y * r.k * dt;
  r.acc += dt;
  if (r.acc >= STEP) {
    r.acc -= STEP;
    if (r.n < r.max) r.n++;
    else { r.xs.copyWithin(0, 1, r.n); r.ys.copyWithin(0, 1, r.n); }   // en eski nokta düşer: iz kaynağından kopar
  }
  r.xs[r.n - 1] = x; r.ys[r.n - 1] = y;
}
function drawRibbon(ctx, r, rgb) {
  const n = r.n, m = n - 1;
  if (r.dead || n < 4) return;
  const k = r.age / r.life, a = r.alpha * smooth(0, .2, k) * (1 - smooth(.5, 1, k));   // yavaşça belirir, uzaklaşınca söner
  if (a < .01) return;
  const xs = r.xs, ys = r.ys;
  if (Math.abs(xs[m] - xs[0]) + Math.abs(ys[m] - ys[0]) < 3) return;
  for (let i = 0; i <= m; i++) {
    const p = i ? i - 1 : 0, q = i < m ? i + 1 : m;
    const tx = xs[q] - xs[p], ty = ys[q] - ys[p], l = Math.hypot(tx, ty) || 1, u = i / m;
    UX[i] = -ty / l; UY[i] = tx / l;
    HW[i] = r.wid * Math.pow(Math.sin(Math.PI * Math.pow(u, 1.2)), .85);   // ince başlar, ortada dolgun, sivrilerek biter
  }
  const grd = ctx.createLinearGradient(xs[0], ys[0], xs[m], ys[m]);
  grd.addColorStop(0, `rgba(${rgb},${(a * .08).toFixed(3)})`);
  grd.addColorStop(.45, `rgba(${rgb},${a.toFixed(3)})`);
  grd.addColorStop(1, `rgba(${rgb},${(a * .75).toFixed(3)})`);
  ctx.fillStyle = grd;
  ctx.beginPath();
  ctx.moveTo(xs[0], ys[0]);
  for (let i = 1; i < m; i++) ctx.lineTo(xs[i] + UX[i] * HW[i], ys[i] + UY[i] * HW[i]);
  ctx.lineTo(xs[m], ys[m]);
  for (let i = m - 1; i >= 1; i--) ctx.lineTo(xs[i] - UX[i] * HW[i], ys[i] - UY[i] * HW[i]);
  ctx.closePath();
  ctx.fill();
  if (r.wid >= 1.4) {                                   // kuru fırça: gövdenin iki yanında ayrışan ince kıllar
    ctx.strokeStyle = `rgba(${rgb},${(a * .5).toFixed(3)})`;
    ctx.lineWidth = .55;
    for (let side = -1; side <= 1; side += 2) {
      const i0 = Math.round(m * (side < 0 ? .14 : .38)), i1 = Math.round(m * (side < 0 ? .66 : .93));
      ctx.beginPath();
      for (let i = i0; i <= i1; i++) {
        const o = side * (HW[i] + 1.1), px = xs[i] + UX[i] * o, py = ys[i] + UY[i] * o;
        i === i0 ? ctx.moveTo(px, py) : ctx.lineTo(px, py);
      }
      ctx.stroke();
    }
  }
}
/* Serbest izler: iki katmanda da aynı konumda (A'da beyaz, B'de siyah) */
const FREE = [];
function spawnFree(r) {
  startRibbon(r, rand(-250, W * .85), rand(110, 1000));
  r.max = (rand(32, RN)) | 0; r.life = rand(5, 9); r.wid = rand(.8, 2.7); r.alpha = rand(.35, .8); r.k = rand(.8, 1.3);
}
/* Figür izleri: silüetin rüzgâr altındaki kenar noktalarından, seyrek olarak doğar */
function edgeStart(r, f) {
  const E = f.flip ? f.sp.edgesL : f.sp.edgesR;
  if (!E.length) return false;
  const i = ((Math.random() * E.length / 2) | 0) * 2;
  startRibbon(r, f.x - f.w / 2 + E[i] * f.w - 2, f.y - f.h + E[i + 1] * f.h);
  return true;
}
function spawnFigTrail(L, r) {
  let pick = Math.random() * L.total, f = L.live[0];
  for (const g of L.live) { pick -= g.h; if (pick <= 0) { f = g; break; } }     // büyük figürden daha çok iz
  if (f.p < .7) { r.wait = .4; return; }                 // figür henüz toplanmadı
  if (!edgeStart(r, f)) { r.wait = 5; return; }
  r.max = clamp(Math.round(f.h / 9), 12, 46);
  r.wid = clamp(f.h * rand(.006, .011), .9, 4.2);
  r.life = rand(...CONFIG.wind.trailLife);
  r.alpha = rand(.55, .95);
  r.k = rand(.55, .95);
}
/* Sayfadan çıkan silüet: kenarlarından bir anda çok sayıda iz kopar, figür izlere dönüşür */
function burst(L, f) {
  const n = clamp(Math.round(f.h / 34), 3, 14);
  for (let k = 0; k < n && L.burst.length < 56; k++) {
    const r = newRibbon();
    if (!edgeStart(r, f)) return;
    r.max = clamp(Math.round(f.h / 7), 14, 56);
    r.wid = clamp(f.h * rand(.006, .013), .9, 4.6);
    r.life = rand(1.6, 3.2);
    r.alpha = rand(.6, 1);
    r.k = rand(.9, 1.7);
    L.burst.push(r);
  }
}

/* =====================================================================
   10) YAPRAKLAR — rüzgârla taşınır; hafif yerçekimi + hava direnci.
       phi: yaprağın kendi ekseni etrafındaki taklası (scaleY = cos phi → kenar üstünde ince çizgi).
       Takla döndükçe yanal kuvvetin yönü değişir → salınarak düşme.
   ===================================================================== */
const LEAVES = [];
function resetLeaf(l, first) {
  const c = CONFIG.leaves;
  l.x = first ? rand(-40, W) : -40 - rand(260);         // ekrandan çıkan yaprak soldan yeniden girer
  l.y = rand(-140, H * .72);
  l.vx = CONFIG.wind.speed * .4; l.vy = 0;
  l.phi = rand(TAU); l.wphi = rand(1.3, 3) * (Math.random() < .5 ? -1 : 1);
  l.th = rand(TAU); l.wth = rand(-.7, .7);
  l.kind = (Math.random() * LEAF_SPRITES.length) | 0;
  l.size = c.size[0] + (c.size[1] - c.size[0]) * Math.pow(l.z, 1.4);
}
function initLeaves() {
  const n = CONFIG.leaves.count;
  for (let i = 0; i < n; i++) {
    const z = (i + .5) / n, l = { z, blur: z < .3 ? 2 : z < .55 ? 1 : 0, alpha: .55 + .45 * z };   // z: 0 uzak … 1 yakın
    resetLeaf(l, true);
    LEAVES.push(l);                                     // uzaktan yakına sıralı
  }
}
function stepLeaf(l, dt) {
  const c = CONFIG.leaves, d = .45 + .55 * l.z;         // uzaktakiler daha yavaş
  Wind.sample(l.x, l.y, V);
  const rx = V.x * d - l.vx, ry = V.y * d - l.vy, rel = Math.hypot(rx, ry) + .001;   // yaprağa göre hava hızı
  const face = Math.abs(Math.cos(l.phi));               // 1: yüzü dönük (çok direnç), 0: kenar üstü
  const kd = c.drag * (.55 + .9 * face), sw = c.sway * Math.sin(2 * l.phi) * d / rel;
  l.vx += (kd * rx - ry * sw) * dt;
  l.vy += (kd * ry + rx * sw + c.gravity * d * (1.25 - .5 * face)) * dt;
  l.x += l.vx * dt; l.y += l.vy * dt;
  l.phi += l.wphi * (.6 + rel * .012) * dt;             // esintide daha hızlı takla
  l.th += (l.wth + .8 * Math.sin(l.phi)) * (.6 + rel * .008) * dt;
  if (l.x > W + 90 || l.y > H + 90 || l.x < -400) resetLeaf(l, false);
}
function drawLeaf(ctx, l, key, safe) {
  const sp = LEAF_SPRITES[l.kind], img = sp[key][l.blur], w = l.size * sp.fw, h = l.size * sp.fh;
  let sy = Math.cos(l.phi);
  if (Math.abs(sy) < .05) sy = sy < 0 ? -.05 : .05;
  const c = Math.cos(l.th), s = Math.sin(l.th);
  ctx.globalAlpha = l.alpha * safeFade(l.x, l.y, safe);
  ctx.setTransform(c, s, -s * sy, c * sy, l.x, l.y);
  ctx.drawImage(img, -w / 2, -h / 2, w, h);
}

/* =====================================================================
   11) DAL — köşeden girer; kökü sabit, rüzgârla eğilir ve yaylanarak geri gelir
   ===================================================================== */
const Branch = { th: 0, w: 0 };
function stepBranch(dt) {
  const b = CONFIG.branch, x = b.corner === 'right' ? W - 200 : 200, s = Wind.strength(x);
  const target = b.bend * (s - CONFIG.wind.calm) + b.flutter * s * Noise(Wind.t * 1.4, 9.3, 0);
  for (let left = dt; left > 0; left -= .016) {          // yay-sönüm: küçük adımlarla, kare hızından bağımsız
    const h = Math.min(left, .016);
    Branch.w += (b.stiff * (target - Branch.th) - b.damp * Branch.w) * h;
    Branch.th += Branch.w * h;
  }
}
/* Dal dikey dilimlere bölünür; her dilim bir öncekine göre biraz daha döner (kökten uca artan eğilme). */
function drawBranch(ctx, key) {
  const b = CONFIG.branch, sp = BRANCH_SPRITE, img = sp[key];
  const w = b.width, h = w / sp.aspect, n = b.slices, sw = w / n, ssw = img.width / n, py = h * sp.rootY;
  ctx.save();
  ctx.translate(b.corner === 'right' ? W + b.overhang : -b.overhang, b.y + py);
  if (b.corner === 'right') ctx.scale(-1, 1);            // görselde kök solda; sağ köşe için yatay çevrilir
  for (let i = 0; i < n; i++) {
    ctx.rotate(Branch.th / n);
    ctx.drawImage(img, i * ssw, 0, ssw, img.height, 0, -py, sw + 1.5, h);
    ctx.translate(sw, 0);
  }
  ctx.restore();
}

/* Bonsai: nature:"bonsai" olan sayfalarda çam dalının yerini alır; sağ altta durur, saksısı sabit,
   gövdesi yukarı doğru artan çok hafif bir salınımla rüzgâra eşlik eder. */
let BONSAI_SPRITE = null;
function fallbackBonsai() {                             // dosya yoksa: sade bir bonsai
  const [c, g] = blank(600, 640);
  g.lineCap = 'round';
  g.beginPath(); g.moveTo(170, 548); g.lineTo(430, 548); g.lineTo(404, 616); g.lineTo(196, 616); g.closePath(); g.fill();
  g.fillRect(154, 530, 292, 24);
  const trunk = t => [300 - 62 * Math.sin(t * 5.2) * (1 - t * .3), 534 - 330 * t];
  for (let i = 0; i <= 60; i++) { const [x, y] = trunk(i / 60); g.beginPath(); g.arc(x, y, 27 - 19 * i / 60, 0, TAU); g.fill(); }
  const pad = (x, y, w) => {                            // yaprak kümesi: altı düz, üstü kabarık bulut
    for (let i = 0; i < 7; i++) { g.beginPath(); g.ellipse(x + (i - 3) * w * .14, y - (i % 2) * w * .1, w * .22, w * .15, 0, 0, TAU); g.fill(); }
    g.fillRect(x - w * .5, y, w, w * .07);
  };
  for (const [t, dx, w] of [[.42, -150, 200], [.58, 150, 210], [.78, -110, 190], [1, 20, 260]]) {
    const [x, y] = trunk(t);
    g.lineWidth = 11; g.beginPath(); g.moveTo(x, y); g.lineTo(x + dx, y - 22); g.stroke();
    pad(x + dx, y - 34, w);
  }
  return c;
}
function drawBonsai(ctx, key) {
  const b = CONFIG.bonsai, sp = BONSAI_SPRITE, img = sp[key], w = b.h * sp.aspect, n = b.slices, sh = b.h / n, ih = img.height / n;
  const s = Wind.strength(b.x), lean = b.h * b.sway * ((s - CONFIG.wind.calm) + .25 * s * Noise(Wind.t * .9, 4.1, 0));
  for (let i = 0; i < n; i++) {                         // yatay dilimler: yukarı çıktıkça daha çok kayar
    const t = 1 - (i + .5) / n, off = lean * Math.pow(Math.max(0, t - .18) / .82, 1.7);
    ctx.drawImage(img, 0, i * ih, img.width, ih, b.x - w / 2 + off, b.y - b.h + i * sh, w, sh + .6);
  }
}

/* =====================================================================
   12) KATMANLAR — her katman tek tuvalde, kendi renginde çizilir. Sıra:
       serbest izler → (reversed A'da) gizli ipucu kesimi → figür izleri → uzak yapraklar → dal
       → silüetler → yakın yapraklar.  İzler her zaman silüetlerin ARKASINDA kalır.
       Tuvaller ve izler kalıcıdır; sayfa değişince yalnızca figür listesi yenilenir (setScene).
   ===================================================================== */
function makeLayer(canvas, key) {
  return {
    ctx: canvas.getContext('2d'), key, w: key === 'white' ? A : B, rgb: key === 'white' ? '255,255,255' : '0,0,0', color: CONFIG.colors[key],
    figs: [], live: [], total: 0, lines: [], nTrails: 0,     // figs: çizilenler (çıkanlar dahil); live: bu sayfanınkiler
    trails: Array.from({ length: CONFIG.wind.figTrails[1] }, newRibbon), burst: [], other: null, cut: false,
    safe: [], mask: null,                                   // metin güvenli alanı: dikdörtgenler + silme maskesi (bkz. updateSafe)
    bonsai: false, ba: 0                                    // bu katmanda bonsai mi var; ba: 0 dal … 1 bonsai (yumuşak geçiş)
  };
}
/* Yeni sayfanın sahnesi: görünen katmandaki eski silüetler rüzgârla dağılır, yenileri rüzgârın
   içinden süzülerek gelir. Görünmeyen katmanda değişim anında olur. */
function setScene(s, target, first) {
  const c = CONFIG.wind;
  for (const L of [layerW, layerB]) {
    const visNow = !first && L.w === S.world, visAfter = L.w === target, sc = sceneFor(s, L.key);
    if (visNow) {
      for (const f of L.figs) if (f.mode !== 'out') { f.mode = 'out'; f.p = clamp(f.p, 0, 1); burst(L, f); }
      L.lines.forEach(l => { l.goal = 0; });
    } else { L.figs.length = 0; L.lines.length = 0; }
    for (const f of sc.figs) {
      // geçiş bitince görünecekse süzülerek gelir; kaybolmakta olan zeminde ise ancak zemin kapandıktan sonra belirir
      if (visAfter) { f.mode = 'in'; f.p = -rand(.15, .55); }
      else if (visNow) { f.mode = 'in'; f.p = -1.6; }
      L.figs.push(f);
    }
    for (const l of sc.lines) L.lines.push({ y: l.y, from: l.from, to: l.to, a: visAfter || visNow ? (visAfter ? 0 : -3) : 1, goal: 1 });
    L.live = sc.figs;
    L.total = sc.figs.reduce((sum, f) => sum + f.h, 0);
    L.nTrails = sc.figs.length ? clamp(Math.round(L.total * c.figTrailDensity), c.figTrails[0], c.figTrails[1]) : 0;
    L.bonsai = s.nature === 'bonsai' && (s.type !== 'reversed' || L.w === B);
    if (!visNow) L.ba = L.bonsai ? 1 : 0;
  }
  layerW.cut = s.type === 'reversed';
}
/* Silüet yatay şeritler halinde çizilir; her şeridin rüzgâr altı (sağ) kenarı birkaç piksel
   ileri geri oynar, rüzgâr üstü kenar sabit kalır — kumaş rüzgârda oynuyormuş gibi.
   Gelirken/giderken (p < 1) şeritler rüzgâr yönünde, her biri farklı mesafede kayar ve uzar:
   figür yatay fırça izlerine ayrışır. */
function drawFigure(ctx, f, img) {
  const e = f.mode === 'on' ? 0 : 1 - smooth(0, 1, f.p);
  if (e > .995) return;
  const dx = f.x - f.w / 2, dy = f.y - f.h, sy = img.height / f.h, kk = 9 / f.h, strip = CONFIG.wind.strip, a0 = ctx.globalAlpha;
  const reach = (f.mode === 'out' ? 1 : -1) * (f.flip ? -1 : 1) * e * e * (440 + .55 * f.h);
  if (e) ctx.globalAlpha = a0 * Math.pow(1 - e, 1.2);
  if (f.flip) { ctx.save(); ctx.translate(2 * f.x, 0); ctx.scale(-1, 1); }
  for (let y = 0; y < f.h; y += strip) {
    const hh = Math.min(strip, f.h - y);
    const d = f.amp * (Math.sin(y * kk - f.ph) + .5 * Math.sin(y * kk * 2.7 - f.ph * 1.6));
    let off = 0, st = 0;
    if (e) {
      const hs = Math.abs(Math.sin(y * 12.9898 + f.seed) * 43758.5453) % 1;
      off = reach * (.25 + .75 * (.5 + .5 * Noise(y * .03, f.seed, 0))) * (.9 + .1 * hs);
      st = Math.abs(off) * .5;
    }
    if (f.flip) ctx.drawImage(img, 0, y * sy, img.width, hh * sy, dx - d + off, dy + y, f.w + d + st, hh);
    else ctx.drawImage(img, 0, y * sy, img.width, hh * sy, dx + off, dy + y, f.w + d + st, hh);
  }
  if (f.flip) ctx.restore();
  ctx.globalAlpha = a0;
}
function stepLayer(L, dt) {
  const c = CONFIG.wind, active = Math.round(L.nTrails * Q.trail);
  for (let i = L.figs.length - 1; i >= 0; i--) {
    const f = L.figs[i], s = Wind.strength(f.x);
    if (f.mode === 'in') { f.p += dt / 1.5; if (f.p >= 1) { f.p = 1; f.mode = 'on'; } }
    else if (f.mode === 'out') { f.p -= dt / 1.15; if (f.p <= 0) { L.figs.splice(i, 1); continue; } }
    f.ph += dt * (.8 + 3.2 * s);                        // kenar dalgalanması esintiyle güçlenir ve hızlanır
    f.amp = clamp(f.h * c.ripple, .5, 3.2) * (.25 + .75 * s);
  }
  L.ba = clamp(L.ba + (L.bonsai ? 1.3 : -1.3) * dt, 0, 1);
  for (let i = L.lines.length - 1; i >= 0; i--) {
    const l = L.lines[i];
    l.a += (l.goal ? 1.4 : -2.2) * dt;
    if (l.goal) l.a = Math.min(l.a, 1); else if (l.a <= 0) L.lines.splice(i, 1);
  }
  for (let i = 0; i < L.trails.length; i++) {
    const r = L.trails[i];
    if (!r.dead) stepRibbon(r, dt);
    else if (i < active) {
      r.wait -= dt * (.5 + 2 * Wind.gust(W / 2));        // esinti geldiğinde daha çok iz doğar
      if (r.wait <= 0) { r.wait = rand(.6, 4.5); spawnFigTrail(L, r); }
    }
  }
  for (let i = L.burst.length - 1; i >= 0; i--) {
    stepRibbon(L.burst[i], dt);
    if (L.burst[i].dead) L.burst.splice(i, 1);
  }
}
function drawLayer(L) {
  const ctx = L.ctx, key = L.key, nFree = Math.round(FREE.length * Q.trail);
  ctx.setTransform(1, 0, 0, 1, 0, 0);
  ctx.globalCompositeOperation = 'source-over';
  ctx.globalAlpha = 1;
  ctx.clearRect(0, 0, W, H);

  for (let i = 0; i < nFree; i++) drawRibbon(ctx, FREE[i], L.rgb);
  if (L.cut) {
    // Gizli ipucu (yalnızca reversed A): serbest beyaz izler, görünmeyen siyah silüetlerin arkasından geçerken kesilir
    ctx.globalCompositeOperation = 'destination-out';
    for (const f of L.other.figs) drawFigure(ctx, f, f.sp.black);
    ctx.globalCompositeOperation = 'source-over';
  }
  for (const r of L.trails) drawRibbon(ctx, r, L.rgb);
  for (const r of L.burst) drawRibbon(ctx, r, L.rgb);
  if (L.mask && L.safe.length) {                         // izler metin alanlarında silinir (yumuşak kenarlı maske)
    ctx.globalCompositeOperation = 'destination-out';
    ctx.drawImage(L.mask, 0, 0, W, H);
    ctx.globalCompositeOperation = 'source-over';
  }

  let i = 0;
  for (; i < Q.leaves && LEAVES[i].z < .6; i++) drawLeaf(ctx, LEAVES[i], key, L.safe);
  ctx.setTransform(1, 0, 0, 1, 0, 0);
  ctx.globalAlpha = 1;
  if (L.ba < .99) { ctx.globalAlpha = 1 - L.ba; drawBranch(ctx, key); }
  if (L.ba > .01 && BONSAI_SPRITE) { ctx.globalAlpha = L.ba; drawBonsai(ctx, key); }
  ctx.globalAlpha = 1;
  for (const f of L.figs) drawFigure(ctx, f, f.sp[key]);
  ctx.fillStyle = L.color;
  for (const l of L.lines) if (l.a > 0) { ctx.globalAlpha = Math.min(1, l.a); ctx.fillRect(l.from, l.y, l.to - l.from, 1.5); }
  for (; i < Q.leaves; i++) drawLeaf(ctx, LEAVES[i], key, L.safe);
  ctx.setTransform(1, 0, 0, 1, 0, 0);
  ctx.globalAlpha = 1;
}

/* Kalite: kare hızı düşerse önce iz sayısı, o da yetmezse yaprak sayısı otomatik azalır */
const Q = { trail: 1, leaves: CONFIG.leaves.count, acc: 0, work: 0, n: 0, warm: 2 };
function governor(rawDt, workMs) {
  if (document.hidden || rawDt > .25) return;
  Q.acc += rawDt; Q.work += workMs; Q.n++;
  if (Q.n < 90) return;
  const avg = Q.acc / Q.n, p = CONFIG.perf;
  STATS.fps = 1 / avg; STATS.ms = Q.work / Q.n;
  // Yalnızca çizim gerçekten pahalıysa azalt (50/30 Hz ekranlarda düşük kare hızı yanıltmasın)
  if (Q.warm > 0) Q.warm--;
  else if (avg > 1 / p.minFps && STATS.ms > 6) {
    if (Q.trail > p.minTrail) Q.trail = Math.max(p.minTrail, Q.trail - .2);
    else if (Q.leaves > p.minLeaves) Q.leaves -= 2;
  }
  STATS.trail = Q.trail; STATS.leaves = Q.leaves;
  Q.acc = Q.work = Q.n = 0;
}

let layerW = null, layerB = null, last = 0;
function loop(now) {
  const raw = (now - last) / 1000, dt = Math.min(raw, .05);   // tüm hareket delta-time ile
  last = now;
  const t0 = performance.now();
  Wind.update(dt);
  const nFree = Math.round(FREE.length * Q.trail);
  for (let i = 0; i < nFree; i++) { const r = FREE[i]; if (r.dead) spawnFree(r); else stepRibbon(r, dt); }
  for (let i = 0; i < Q.leaves; i++) stepLeaf(LEAVES[i], dt);
  stepBranch(dt);
  stepLayer(layerW, dt);
  stepLayer(layerB, dt);
  // İki katman da hep canlıdır; tamamen örtülü olan (o an hiçbir pikseli görünmeyen) tuval boşuna boyanmaz
  if (S.busy || S.world === 'A') drawLayer(layerW);
  if (S.busy || S.world === 'B') drawLayer(layerB);
  governor(raw, performance.now() - t0);
  requestAnimationFrame(loop);
}

/* =====================================================================
   13) ALTIN YÜZÜK — Three.js. Yüzüğün deliği = diğer dünyanın zemini.
       Her karede yüzüğün orta çemberi kameradan project() ile ekrana düşürülür ve
       #hole bu çokgene kırpılır. (ellipse() yerine polygon(): eğim ve perspektifle
       iz düşüm eksenlere hizalı bir elips olmaktan çıkar; çokgen her açıda tam oturur.
       Kırpma sınırı tüpün orta çizgisinde kaldığından tüp onu her zaman örter.)
       Işıltı: ikinci bir tuvalde UnrealBloomPass; "screen" karışımıyla yalnızca ışığı eklenir.
   ===================================================================== */
// GSAP bu değerleri sürer. cy: merkezin yukarı kayması (birim); mode: 'world' zemini kırpar, 'closing' yalnızca deliği hesaplar
const RS = { s: 0, th: CONFIG.ring.theta[0], tilt: CONFIG.ring.tilt[0], cy: 0, invert: false, mode: 'world' };
const Ring = {
  three: null, bloom: null, fb: null,
  pts: new Float32Array(CONFIG.ring.segments * 2), n: 0,   // deliğin ekrandaki çokgeni (px)
  initThree(THREE, RoomEnvironment) {
    const r = CONFIG.ring;
    const renderer = new THREE.WebGLRenderer({ canvas: glCanvas, alpha: true, antialias: true });
    renderer.setClearColor(0x000000, 0);
    renderer.toneMapping = THREE.ACESFilmicToneMapping;
    renderer.toneMappingExposure = 1.2;
    const scene = new THREE.Scene();
    const pmrem = new THREE.PMREMGenerator(renderer);
    scene.environment = pmrem.fromScene(new RoomEnvironment(renderer), .03).texture;   // ayna yansıması için ortam
    pmrem.dispose();
    const camera = new THREE.PerspectiveCamera(r.fov, W / H, .1, 100);
    camera.position.z = r.dist;
    camera.updateMatrixWorld();                          // project() ilk render'dan önce de doğru çalışsın
    const mesh = new THREE.Mesh(
      new THREE.TorusGeometry(r.radius, r.tube, 72, 240),                              // sade yüzey: desen yok
      new THREE.MeshStandardMaterial({ color: CONFIG.colors.gold, metalness: r.metalness, roughness: r.roughness })
    );
    const group = new THREE.Group();
    group.add(mesh);
    scene.add(group);
    this.three = { THREE, renderer, scene, camera, mesh, group, v: new THREE.Vector3() };
    this.resize();
  },
  initBloom(EffectComposer, RenderPass, UnrealBloomPass, OutputPass, RoomEnvironment) {
    const { THREE, camera, mesh } = this.three, b = CONFIG.ring.bloom;
    const renderer = new THREE.WebGLRenderer({ canvas: glowCanvas, antialias: false });
    renderer.toneMapping = THREE.ACESFilmicToneMapping;
    renderer.toneMappingExposure = 1.2;
    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x000000);
    const pmrem = new THREE.PMREMGenerator(renderer);
    scene.environment = pmrem.fromScene(new RoomEnvironment(renderer), .03).texture;
    pmrem.dispose();
    const m2 = new THREE.Mesh(mesh.geometry, mesh.material.clone()), group = new THREE.Group();
    group.add(m2);
    scene.add(group);
    const composer = new EffectComposer(renderer);
    composer.addPass(new RenderPass(scene, camera));
    composer.addPass(new UnrealBloomPass(new THREE.Vector2(W / 2, H / 2), b.strength, b.radius, b.threshold));
    composer.addPass(new OutputPass());
    this.bloom = { renderer, composer, mesh: m2, group };
    this.resize();
  },
  resize() {
    const k = stageScale * Math.min(devicePixelRatio || 1, 2);
    if (this.three) this.three.renderer.setSize(Math.round(W * k), Math.round(H * k), false);
    if (this.bloom) {                                    // ışıltı yarı çözünürlükte yeter
      const w = Math.round(W * k / 2), h = Math.round(H * k / 2);
      this.bloom.renderer.setSize(w, h, false);
      this.bloom.composer.setSize(w, h);
    }
  },
  // Three.js yüklenemezse: aynı matematikle 2B tuvale çizilen sade altın halka
  fallback() {
    if (!this.fb) {
      const c = mkCanvas(W, H);
      glCanvas.after(c);
      this.fb = c.getContext('2d');
    }
    return this.fb;
  },
  update() {
    const r = CONFIG.ring, n = r.segments, T = Ring.three, BL = Ring.bloom, P = Ring.pts, world = RS.mode === 'world';
    if (RS.s < .0005) {                                  // yüzük henüz tohumun içinde
      if (world) hole.style.clipPath = RS.invert ? 'none' : HOLE_CLOSED;
      Ring.clear();
      Ring.n = 0;
      return;
    }
    let poly = '', first = '';
    const add = (px, py, i) => {
      P[i * 2] = px; P[i * 2 + 1] = py;
      if (!world) return;
      const s = px.toFixed(2) + 'px ' + py.toFixed(2) + 'px';
      if (!i) first = s;
      poly += (i ? ',' : '') + s;
    };
    if (T) {
      if (Ring.fb) Ring.fb.clearRect(0, 0, W, H);
      T.mesh.rotation.y = RS.th;
      T.group.rotation.set(RS.tilt, 0, r.roll);
      T.group.position.y = RS.cy;
      T.group.scale.setScalar(RS.s);
      T.group.updateMatrixWorld(true);
      for (let i = 0; i < n; i++) {
        const a = i / n * TAU;
        T.v.set(Math.cos(a) * r.radius, Math.sin(a) * r.radius, 0).applyMatrix4(T.mesh.matrixWorld).project(T.camera);
        add((T.v.x + 1) * W / 2, (1 - T.v.y) * H / 2, i);
      }
      T.renderer.render(T.scene, T.camera);
      if (BL) {
        BL.mesh.rotation.y = RS.th;
        BL.group.rotation.copy(T.group.rotation);
        BL.group.position.copy(T.group.position);
        BL.group.scale.copy(T.group.scale);
        BL.composer.render();
        glowCanvas.style.visibility = 'visible';
      }
    } else {
      const g = Ring.fallback(), U = H / 2 / Math.tan(r.fov * Math.PI / 360) / r.dist;
      const ct = Math.cos(RS.th), st = Math.sin(RS.th), cx = Math.cos(RS.tilt), sx = Math.sin(RS.tilt);
      const cz = Math.cos(r.roll), sz = Math.sin(r.roll);
      g.clearRect(0, 0, W, H);
      g.beginPath();
      for (let i = 0; i < n; i++) {
        const a = i / n * TAU, c = Math.cos(a) * RS.s, s = Math.sin(a) * RS.s;
        const x1 = c * ct, z1 = -c * st;                             // Y dönüşü
        const x2 = x1 * cz - s * sz, y2 = x1 * sz + s * cz;          // yuvarlanma
        const y3 = y2 * cx - z1 * sx, z3 = y2 * sx + z1 * cx;        // eğim
        const f = r.dist / (r.dist - z3) * U, px = W / 2 + x2 * f, py = H / 2 - (y3 + RS.cy) * f;
        add(px, py, i);
        i ? g.lineTo(px, py) : g.moveTo(px, py);
      }
      g.closePath();
      const grd = g.createLinearGradient(0, 0, W, H);
      grd.addColorStop(0, CONFIG.colors.goldHi); grd.addColorStop(.5, CONFIG.colors.gold); grd.addColorStop(1, CONFIG.colors.goldHi);
      g.strokeStyle = grd;
      g.lineWidth = Math.max(2, 2 * r.tube * RS.s * U);
      g.stroke();
    }
    Ring.n = n;
    if (!world) return;                                  // kapanış: delik #fx tuvalinde kullanılır, zemine dokunulmaz
    // invert: beyaz zemin deliğin DIŞINDA kalır (B → A: delikten siyah dünya görünür)
    hole.style.clipPath = RS.invert
      ? `polygon(evenodd, 0px 0px, ${W}px 0px, ${W}px ${H}px, 0px ${H}px, 0px 0px, ${poly}, ${first}, 0px 0px)`
      : `polygon(${poly})`;
  },
  clear() {
    if (this.three) this.three.renderer.clear();
    if (this.fb) this.fb.clearRect(0, 0, W, H);
    glowCanvas.style.visibility = 'hidden';
  }
};
/* Three.js ve eklentileri yerelden, tek klasik script olarak gelir (assets/vendor/three-kit.js → window.THREE_KIT;
   bkz. tools/build_vendor.py). Yüklenemezse yüzük 2B olarak çizilir. */
if (!PRESENTER) {
  try {
    const K = window.THREE_KIT;
    if (!K) throw new Error('assets/vendor/three-kit.js yüklenmedi');
    Ring.initThree(K.THREE, K.RoomEnvironment);
    try { Ring.initBloom(K.EffectComposer, K.RenderPass, K.UnrealBloomPass, K.OutputPass, K.RoomEnvironment); }
    catch (e) { console.warn('Bloom kurulamadı; yüzük ışıltısız çizilecek.', e); }
  } catch (e) { console.warn('Three.js yüklenemedi; yüzük 2B olarak çizilecek.', e); }
}

/* =====================================================================
   14) SES — Web Audio ile sentezlenir, ses dosyası yok
   ===================================================================== */
const Sound = {
  ctx: null, noise: null, on: true,
  init() {
    try { this.on = localStorage.getItem('ikiliSahne.ses') !== '0'; } catch (e) {}
    soundBtn.classList.toggle('muted', !this.on);
  },
  toggle() {
    this.on = !this.on;
    try { localStorage.setItem('ikiliSahne.ses', this.on ? '1' : '0'); } catch (e) {}
    soundBtn.classList.toggle('muted', !this.on);
    stage.querySelectorAll('video').forEach(v => { v.muted = !this.on; });
    if (this.on) this.ensure();
  },
  // Tarayıcılar sesi yalnızca kullanıcı etkileşiminden sonra başlatır
  ensure() {
    if (!this.on) return null;
    const AC = window.AudioContext || window.webkitAudioContext;
    if (!AC) return null;
    if (!this.ctx) {
      this.ctx = new AC();
      const len = this.ctx.sampleRate * 2;
      this.noise = this.ctx.createBuffer(1, len, this.ctx.sampleRate);
      const d = this.noise.getChannelData(0);
      for (let i = 0; i < len; i++) d[i] = Math.random() * 2 - 1;
    }
    if (this.ctx.state === 'suspended') this.ctx.resume();
    return this.ctx;
  },
  osc(type, f0, f1, t, dur, gain, dest) {
    const c = this.ctx, o = c.createOscillator(), g = c.createGain();
    o.type = type;
    o.frequency.setValueAtTime(f0, t);
    o.frequency.exponentialRampToValueAtTime(f1, t + dur);
    g.gain.value = gain;
    o.connect(g).connect(dest);
    o.start(t); o.stop(t + dur + 1.6);
  },
  whoosh(f0, f1, t, dur, gain, dest) {
    const c = this.ctx, src = c.createBufferSource(), flt = c.createBiquadFilter(), g = c.createGain();
    src.buffer = this.noise; src.loop = true;
    flt.type = 'lowpass'; flt.Q.value = .4;
    flt.frequency.setValueAtTime(f0, t);
    flt.frequency.exponentialRampToValueAtTime(f1, t + dur);
    g.gain.value = gain;
    src.connect(flt).connect(g).connect(dest);
    src.start(t); src.stop(t + dur + 1.6);
  },
  // Derin, yumuşak ton: yüzük büyürken yavaşça yükselir (toB) ya da alçalır (toA)
  ring(dur, rising) {
    const c = this.ensure(); if (!c) return;
    const t = c.currentTime + .02, out = c.createGain(), lp = c.createBiquadFilter();
    out.gain.setValueAtTime(.0001, t);
    out.gain.exponentialRampToValueAtTime(.55, t + dur * .45);
    out.gain.exponentialRampToValueAtTime(.0001, t + dur + 1.4);
    out.connect(c.destination);
    lp.type = 'lowpass'; lp.frequency.value = 520; lp.connect(out);
    const [a, b] = rising ? [49, 65.4] : [65.4, 49];
    this.osc('sine', a, b, t, dur, .9, out);                       // gövde
    this.osc('sine', a * 1.5, b * 1.5, t, dur, .28, out);          // beşli
    this.osc('sine', a * 2.006, b * 2.006, t, dur, .16, out);      // hafif vuru yapan oktav
    this.osc('triangle', a * 2, b * 2, t, dur, .12, lp);           // küçük hoparlörlerde duyulan harmonikler
    this.whoosh(rising ? 160 : 520, rising ? 520 : 160, t, dur, .05, out);
  }
};

/* =====================================================================
   15) SAYFA TİPLERİ — her tip, sayfa verisinden DOM üretir (build). Üretilen DOM
       "bitmiş" haldir: önizlemeler onu olduğu gibi kullanır; canlı sahnede giriş
       hareketleri (enter) ve adımlar (data-step) bunun üstüne eklenir.
         data-in        : sayfaya girerken rüzgâr yönünden süzülerek gelir ("slow": yavaş belirir)
         data-step="n"  : n. "ileri"de açılır
         data-out       : yalnızca çıkışta rüzgârla silinir (girişi tipe özeldir)
         data-fit="px"  : metin bu genişliğe sığana kadar küçültülür (data-fith: yükseklik)
   ===================================================================== */
const IN = { 'data-in': '' }, SLOW = { 'data-in': 'slow' }, OUT = { 'data-out': '' };
const isVideo = src => /\.(mp4|webm|mov|m4v)(\?|$)/i.test(src);

function statText(st) {
  if (!st) return '';
  const v = typeof st.value === 'number' ? st.value.toLocaleString('tr-TR') : st.value;
  return [[v, st.unit].filter(Boolean).join(' '), st.label].filter(Boolean).join(' — ');
}

/* --- Medya: fotoğraf (gri ton + mürekkep maskesi) ya da video (dikeyse telefon çerçevesi) --- */
const INK = [];
function makeInkMasks() {
  // Fotoğraf kenarı: mürekkebin kâğıda yayıldığı gibi organik ve düzensiz bir sınır (çizgi yok, iç kısım tam dolu).
  // Şekil, köşeleri yumuşak bir dikdörtgendir; kenarı üç ölçekte gürültüyle girintili çıkıntılıdır.
  for (let v = 0; v < 3; v++) {
    const n = 640, c = mkCanvas(n, n), g = c.getContext('2d'), rnd = mulberry32(101 + v * 17), K = 420, e = 2 / 9;
    g.fillStyle = '#000';
    if ('filter' in g) g.filter = 'blur(1.4px)';
    g.beginPath();
    for (let i = 0; i < K; i++) {
      const a = i / K * TAU, cs = Math.cos(a), sn = Math.sin(a);
      const k = 1 + .028 * Noise(cs * 2.2 + v * 9, sn * 2.2, 1) + .016 * Noise(cs * 7, sn * 7, v * 5 + 2) + .007 * Noise(cs * 21, sn * 21, v * 3 + 4);
      const x = n / 2 + Math.sign(cs) * Math.pow(Math.abs(cs), e) * n * .462 * k, y = n / 2 + Math.sign(sn) * Math.pow(Math.abs(sn), e) * n * .462 * k;
      i ? g.lineTo(x, y) : g.moveTo(x, y);
    }
    g.closePath();
    g.fill();
    for (let i = 0; i < 34; i++) {                       // kenarda biriken küçük mürekkep damlaları
      const a = rnd() * TAU, cs = Math.cos(a), sn = Math.sin(a), k = .462 + (rnd() - .35) * .03;
      g.beginPath();
      g.arc(n / 2 + Math.sign(cs) * Math.pow(Math.abs(cs), e) * n * k, n / 2 + Math.sign(sn) * Math.pow(Math.abs(sn), e) * n * k, 2 + rnd() * rnd() * 9, 0, TAU);
      g.fill();
    }
    INK.push(`url(${c.toDataURL()})`);
  }
  // Geçiş lekesi: ortadan yayılan düzensiz mürekkep damlası (aşamalı fotoğraflar, bkz. makeStaged)
  const n = 512, c = mkCanvas(n, n), g = c.getContext('2d'), rnd = mulberry32(77), K = 360;
  g.fillStyle = '#000';
  if ('filter' in g) g.filter = 'blur(2.5px)';
  g.beginPath();
  for (let i = 0; i < K; i++) {
    const a = i / K * TAU, cs = Math.cos(a), sn = Math.sin(a);
    const r = n * .4 * (1 + .09 * Noise(cs * 1.6, sn * 1.6, 7) + .04 * Noise(cs * 5, sn * 5, 9) + .015 * Noise(cs * 15, sn * 15, 11));
    i ? g.lineTo(n / 2 + cs * r, n / 2 + sn * r) : g.moveTo(n / 2 + cs * r, n / 2 + sn * r);
  }
  g.closePath();
  g.fill();
  for (let i = 0; i < 26; i++) {                         // lekenin çevresine sıçrayan damlalar
    const a = rnd() * TAU, r = n * (.4 + rnd() * .07);
    g.beginPath();
    g.arc(n / 2 + Math.cos(a) * r, n / 2 + Math.sin(a) * r, 2 + rnd() * rnd() * 10, 0, TAU);
    g.fill();
  }
  document.documentElement.style.setProperty('--blot', `url(${c.toDataURL()})`);
}
const PHONE_AR = .62;                                   // telefon çerçevesinin en geniş hali; daha geniş video içine sığdırılır
function makeMedia(item, o) {
  item = typeof item === 'string' ? { src: item } : item;
  const video = isVideo(item.src), m = h('figure', 'm ' + (video ? 'video' : 'photo'));
  const setAr = ar => { m.dataset.ar = ar; if (m.parentNode) fitMedia(m.parentNode); };
  const missing = () => {                               // dosya yok: düzgün bir yedek kutu
    m.classList.remove('photo');
    m.replaceChildren(h('div', 'ph', [h('b', null, '?'), item.src]));
  };
  if (video) {
    m.dataset.ar = item.portrait ? 9 / 16 : 16 / 9;
    if (item.portrait) m.classList.add('phone');
    if (o.thumb) m.append(h('div', 'ph', [h('b', null, '▶'), item.src.split('/').pop()]));
    else {
      const v = h('video', null, null, { src: encodeURI(item.src), playsinline: '', loop: '', preload: 'auto' });
      v.muted = true;
      v.addEventListener('loadedmetadata', () => {
        if (!v.videoWidth) return;
        const ar = v.videoWidth / v.videoHeight, tall = ar < 1;
        m.classList.toggle('phone', tall);
        setAr(tall ? Math.min(ar, PHONE_AR) : ar);
      });
      v.addEventListener('error', missing);
      m.append(v);
    }
  } else {
    m.dataset.ar = item.portrait ? 3 / 4 : 4 / 3;

/* Aşamalı fotoğraf: aynı çerçevede üst üste katmanlar, hepsi aynı mürekkep kenar maskesiyle. Her aşamada sıradaki
   görsel ortadan yayılan bir mürekkep lekesiyle açılır (geri: leke toplanır); açıklama birlikte değişir ve çerçeve
   o anki görselin oranına yumuşakça uyar. Aşama, applySteps üzerinden adımla birlikte ilerler. */
const BLOT_MAX = 2.3;                                   // lekenin köşeleri de örttüğü ölçek
function makeStaged(items) {
  items = items.map(it => (typeof it === 'string' ? { src: it } : it));
  const m = h('figure', 'm photo staged'), layers = [], caps = [], edge = INK[items[0].src.length % INK.length];
  let cur = 0;
  const refit = () => { m.dataset.ar = layers[cur].ar; if (m.parentNode) fitMedia(m.parentNode); };
  items.forEach((item, k) => {
    const img = h('img', null, null, { src: encodeURI(item.src), alt: '', draggable: 'false' });
    const ink = h('div', 'ink', k ? h('div', 'blot', img) : img);
    ink.ar = item.portrait ? 3 / 4 : 4 / 3;
    img.addEventListener('load', () => { ink.ar = img.naturalWidth / img.naturalHeight; if (k === cur) refit(); });
    img.addEventListener('error', () => ink.replaceChildren(h('div', 'ph', [h('b', null, '?'), item.src])));
    ink.style.setProperty('--ink', edge);
    ink._blot = { s: 0 };
    layers.push(ink);
    caps.push(item.caption ? h('figcaption', null, item.caption) : null);
  });
  m.append(...layers, ...caps.filter(Boolean));
  m._stage = (n, animate) => {
    cur = clamp(n, 0, layers.length - 1);
    layers.forEach((l, k) => {
      if (!k) return;
      const on = k <= cur, b = l._blot;
      const put = () => {

        st.webkitMaskSize = st.maskSize = z + ' ' + z;
        l.style.visibility = b.s > .001 ? 'visible' : 'hidden';
      };
      gsap.killTweensOf(b);
      if (animate) gsap.to(b, { s: on ? BLOT_MAX : 0, duration: 1.3, ease: on ? 'power2.out' : 'power2.in', onUpdate: put });
      else b.s = on ? BLOT_MAX : 0;
      put();

    caps.forEach((c, k) => c && gsap.to(c, { opacity: k === cur ? 1 : 0, duration: animate ? .7 : 0, delay: animate && k === cur ? .3 : 0, overwrite: true }));
    m.classList.toggle('morph', !!animate);

}
/* rect = [sol, üst, genişlik, yükseklik]; öğeler oranları korunarak yan yana sığdırılır */
function mediaBox(items, rect, o) {
  const box = h('div', 'mbox', [].concat(items).map(it => (it instanceof Element ? it : makeMedia(it, o))), IN);
  Object.assign(box.style, { left: rect[0] + 'px', top: rect[1] + 'px', width: rect[2] + 'px', height: rect[3] + 'px' });
  box.dataset.w = rect[2]; box.dataset.h = rect[3];
  fitMedia(box);
  return box;
}
function fitMedia(box) {
  const ms = [...box.children], gap = 44, sum = ms.reduce((a, m) => a + +m.dataset.ar, 0);
  if (!sum) return;
  const hh = Math.min(+box.dataset.h, (+box.dataset.w - gap * (ms.length - 1)) / sum);
  ms.forEach(m => { m.style.height = hh + 'px'; m.style.width = hh * m.dataset.ar + 'px'; });

/* --- Daktilo: satır, yerleşim oynamadan harf harf yazılır --- */

/* --- QR (cdnjs: qrcode-generator). Her zaman beyaz üstüne siyah: ters renkli QR'ı çoğu kamera okumaz --- */
function qrSvg(text) {
  if (!window.qrcode) return '';
  const q = qrcode(0, 'M'), m = 3;
  q.addData(text); q.make();
  const n = q.getModuleCount();

  for (let r = 0; r < n; r++) for (let c = 0; c < n; c++) if (q.isDark(r, c)) d += `M${c + m} ${r + m}h1v1h-1z`;
  return `<svg viewBox="0 0 ${n + 2 * m} ${n + 2 * m}" shape-rendering="crispEdges"><path d="${d}" fill="#000"/></svg>`;
}
