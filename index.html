/* --- Canlı sayfanın ortak hareketleri --- */
function track(el, tw) { (el._tw || (el._tw = [])).push(tw); return tw; }
function destroy(el) {
  (el._tw || []).forEach(t => t.kill());
  el.querySelectorAll('video').forEach(v => { v.pause(); v.removeAttribute('src'); v.load(); });
  el.remove();
}
function windIn(el, delay) {                            // rüzgârın geldiği yönden (soldan) süzülerek gelir
  const fast = el.querySelectorAll('[data-in=""]'), slow = el.querySelectorAll('[data-in="slow"]');
  if (fast.length) track(el, gsap.fromTo(fast, { opacity: 0, x: -80 }, { opacity: 1, x: 0, duration: .95, ease: 'power3.out', stagger: .085, delay }));
  if (slow.length) track(el, gsap.fromTo(slow, { opacity: 0, x: -24 }, { opacity: 1, x: 0, duration: 1.9, ease: 'power2.out', stagger: .12, delay: delay + .15 }));
}
function windOut(el) {                                  // rüzgâr yönünde (sağa) silinir
  (el._tw || []).forEach(t => t.kill());
  el.querySelectorAll('video').forEach(v => v.pause());
  gsap.to(el.querySelectorAll('[data-in], [data-step], [data-out]'),
    { x: '+=120', duration: .55, ease: 'power2.in', stagger: { amount: .18 }, overwrite: true });
  gsap.to(el, { opacity: 0, duration: .62, ease: 'power2.in', onComplete: () => destroy(el) });
}
/* Adımlar: data-step ≤ step olanlar görünür. Yeni açılan adımdaki fırça rakam o anda çizilir. */
function applySteps(el, step, animate) {
  el.querySelectorAll('[data-step]').forEach(n => {
    const on = +n.dataset.step <= step;
    if (n._on === on) return;
    n._on = on;
    if (!animate) { n.style.opacity = on ? 1 : 0; return; }
    if (on) {
      track(el, gsap.fromTo(n, { opacity: 0, x: -60 }, { opacity: 1, x: 0, duration: .8, ease: 'power3.out', overwrite: true, delay: +n.dataset.delay || 0 }));
      n.querySelectorAll('.brush').forEach(b => track(el, Brush.draw(b, .5, .12)));
    } else track(el, gsap.to(n, { opacity: 0, x: 40, duration: .3, ease: 'power2.in', overwrite: true }));
  });
  el.querySelectorAll('.m.staged').forEach(m => m._stage(step, animate));
}
function fit(root) {
  const tall = root.querySelectorAll('[data-fitv]');
  // 1) yüksekliğe sığmayan reversed sütunu önce "sıkı" dizgiye geçer (daha geniş sütun, daha küçük punto)
  tall.forEach(el => {
    el.style.transform = '';
    el.classList.remove('dense');
    if (el.classList.contains('col') && el.offsetHeight > +el.dataset.fitv) el.classList.add('dense');
  });
  // 2) tek satırlık başlıklar genişliğe (data-fit), dikey başlık yüksekliğe (data-fith) sığana kadar küçülür
  for (const [attr, prop] of [['fit', 'offsetWidth'], ['fith', 'offsetHeight']]) {
    root.querySelectorAll(`[data-${attr}]`).forEach(el => {
      el.style.fontSize = '';
      const max = +el.dataset[attr], v = el[prop];
      if (v > max) el.style.fontSize = (parseFloat(getComputedStyle(el).fontSize) * max / v) + 'px';
    });
  }
  // 3) hâlâ taşan blok bütün olarak küçültülür
  tall.forEach(el => { const max = +el.dataset.fitv, v = el.offsetHeight; if (v > max) el.style.transform = `scale(${(max / v).toFixed(3)})`; });
}

/* =====================================================================
   16) GEÇİŞLER — yalnızca zemin (#hole'un kırpma alanı) değişir; rüzgâr, yapraklar,
       dal ve tuvaller hiç durmaz.
       Yüzük  : reversed sayfada iki dünya arasında. 'toB' (A → B): yüzük beyaz tohumdan doğar,
                ağır ağır dönerek büyür; deliği beyaz dünyadır. 'toA' (B → A): siyah tohumdan doğar.
       Leke   : zemin rengi farklı iki sayfa arasında; hedef zeminin renginde, kenarı gürültüyle
                düzensizleşen bir mürekkep damlası yayılır.
   ===================================================================== */
function ringTimeline(dur) {
  const r = CONFIG.ring, tIn = dur * .2;
  return gsap.timeline({ paused: true, onUpdate: Ring.update })
    // tohumdan doğar → ağır bir kütle gibi dönerek büyür → yüzünü kameraya dönüp ekrandan taşar
    .fromTo(RS, { s: 0 }, { s: r.scale[0], duration: tIn, ease: 'power2.out' }, 0)
    .to(RS, { s: r.scale[1], duration: dur - tIn, ease: 'power2.in' }, tIn)
    .fromTo(RS, { th: r.theta[0] }, { th: r.theta[1], duration: dur, ease: 'sine.inOut' }, 0)
    .fromTo(RS, { tilt: r.tilt[0] }, { tilt: r.tilt[1], duration: dur, ease: 'sine.inOut' }, 0);
}
function setWorld(w) {
  S.world = S.target = w;
  stage.dataset.world = w;
  RS.s = 0; RS.invert = false;
  Ring.clear();
  hole.style.clipPath = w === B ? 'none' : HOLE_CLOSED;       // B: zemin tamamen beyaz
}
function settle(w) {                                    // bir zemin geçişi bitti
  setWorld(w);
  S.busy = false; S.tl = null;
  S.pending.forEach(el => { el.style.visibility = ''; });
  S.pending.length = 0;
  syncMedia();
}
function fastForward() { if (S.tl) S.tl.progress(1); }  // geçiş sürerken gelen komut: geçişi bitir, sonra uygula

function ringTransition(direction) {
  if (S.busy) return null;
  Closing.stop(true);
  RingShow.stop();
  S.busy = true;
  const toB = direction === 'toB', w = toB ? B : A, dur = toB ? CONFIG.dur.toB : CONFIG.dur.toA;
  const emerge = toB || CONFIG.ring.toA === 'emerge', side = CUR.els.find(el => el._w === w);
  const reveal = () => { if (side && TYPES.reversed.reveal) TYPES.reversed.reveal(side); };
  const tl = ringTimeline(dur), done = () => { settle(w); Enso.draw(); if (!emerge) reveal(); };
  S.target = w; S.tl = tl;
  syncMedia();
  Sound.ring(dur, toB);
  gsap.to(ringBtn, { rotationY: toB ? 180 : 0, duration: dur, ease: 'power2.inOut' });
  if (emerge) {
    RS.invert = !toB;
    tl.call(reveal, null, dur * .78).eventCallback('onComplete', done).play(0);
  } else tl.eventCallback('onReverseComplete', done).progress(1).reverse();
  return tl;
}

const BS = { p: 0, x: W / 2, y: H / 2, rmax: 1, seed: 0, invert: false };
function blotUpdate() {
  const n = 260, R = BS.p * BS.rmax, amp = 1 - .5 * BS.p;   // yayıldıkça kenar sakinleşir
  let poly = '', first = '';
  for (let i = 0; i < n; i++) {
    const a = i / n * TAU, c = Math.cos(a), s = Math.sin(a);
    // kenar: büyük loblar + orta boy girintiler + ince saçaklar; hepsi yayılırken yavaşça kıpırdar
    const k = 1 + amp * (.3 * Noise(c * 1.1 + BS.seed, s * 1.1, BS.p * 1.3) + .12 * Noise(c * 3.1, s * 3.1 + BS.seed, BS.p * 2.2)
      + .05 * Noise(c * 8, s * 8, BS.seed + BS.p * 3));
    const pt = (BS.x + c * R * k).toFixed(1) + 'px ' + (BS.y + s * R * k).toFixed(1) + 'px';
    if (!i) first = pt;
    poly += (i ? ',' : '') + pt;
  }
  // invert: beyaz zemin lekenin DIŞINDA kalır (beyaz → siyah: leke siyah dünyayı açar)
  hole.style.clipPath = BS.invert
    ? `polygon(evenodd, 0px 0px, ${W}px 0px, ${W}px ${H}px, 0px ${H}px, 0px 0px, ${poly}, ${first}, 0px 0px)`
    : `polygon(${poly})`;
}
function blot(w, seed) {
  const rnd = mulberry32(seed * 977 + 13);
  S.busy = true;
  BS.x = 560 + rnd() * 800; BS.y = 330 + rnd() * 420; BS.seed = rnd() * 50; BS.invert = w === A;
  BS.rmax = Math.max(...[[0, 0], [W, 0], [0, H], [W, H]].map(q => Math.hypot(q[0] - BS.x, q[1] - BS.y))) / .76;   // en girintili kenar bile ekranı kaplar
  S.tl = gsap.fromTo(BS, { p: 0 }, { p: 1, duration: CONFIG.dur.blot, ease: 'power2.inOut', onUpdate: blotUpdate, onComplete: () => settle(w) });
}

/* =====================================================================
   17) KAPANIŞ — yüzük ortada doğar ve büyüyerek ekranı dikeyde ikiye böler (sol siyah, sağ beyaz).
       Sonra geri küçülürken yarılar birbirinin etrafında döner, ayrım çizgisi S'ye kıvrılır ve
       tek bir yin-yang dairesinde birleşir; iki tohum yerine oturur, son cümle belirir.
       Yin-yang #fx tuvaline, her karede yüzüğün deliğine (Ring.pts) kırpılarak çizilir.
   ===================================================================== */
const CS = { phi: 0, k: 0, seed: 0 };
const Closing = {
  tl: null, R: 290, cy: 460,                            // birleşmiş dairenin yarıçapı ve merkez yüksekliği (px)
  unit: H / 2 / Math.tan(CONFIG.ring.fov * Math.PI / 360) / CONFIG.ring.dist,   // z=0 düzleminde 1 birim kaç piksel
  frame() { Ring.update(); Closing.draw(); },
  play(el, delay) {
    this.stop(true);
    RingShow.stop();
    const r = CONFIG.ring, U = this.unit, g = this.frame;
    RS.mode = 'closing'; RS.invert = false; RS.cy = 0;
    CS.phi = CS.k = CS.seed = 0;
    fxCanvas.style.visibility = 'visible';
    this.tl = gsap.timeline({ delay, onUpdate: g })
      .fromTo(RS, { s: 0 }, { s: .3, duration: 1, ease: 'power2.out' }, 0)
      .fromTo(RS, { th: r.theta[0] }, { th: TAU, duration: 3, ease: 'sine.inOut' }, 0)
      .fromTo(RS, { tilt: r.tilt[0] }, { tilt: 0, duration: 3, ease: 'sine.inOut' }, 0)
      .to(RS, { s: r.scale[1], duration: 2, ease: 'power2.in' }, 1)                    // ekran ikiye bölündü
      .to(RS, { s: this.R / U, cy: (H / 2 - this.cy) / U, duration: 3.1, ease: 'power3.inOut' }, 3.5)
      .to(CS, { phi: TAU, duration: 3.5, ease: 'power2.inOut' }, 3.3)                  // yarılar birbirinin etrafında döner
      .to(CS, { k: 1, duration: 2.1, ease: 'power2.inOut' }, 4.5)                      // çizgi S'ye kıvrılır
      .to(CS, { seed: 1, duration: .7, ease: 'back.out(2.6)' }, 6.6)                   // tohumlar yerine oturur
      .to(el.querySelectorAll('.line, .sub'), { opacity: 1, duration: 1.6, ease: 'power2.out', stagger: .5 }, 7.1);
    Sound.ring(6, true);
  },
  draw() {
    const g = this.g || (this.g = fxCanvas.getContext('2d')), n = Ring.n, P = Ring.pts, c = CONFIG.colors;
    g.setTransform(1, 0, 0, 1, 0, 0);
    g.clearRect(0, 0, W, H);
    if (!n) return;
    const R = RS.s * this.unit, big = 4200;
    g.save();
    g.beginPath();
    for (let i = 0; i < n; i++) i ? g.lineTo(P[i * 2], P[i * 2 + 1]) : g.moveTo(P[0], P[1]);
    g.closePath();
    g.clip();
    g.translate(W / 2, H / 2 - RS.cy * this.unit);
    g.rotate(CS.phi);
    g.fillStyle = c.black; g.fillRect(-big, -big, big, 2 * big);
    g.fillStyle = c.paper; g.fillRect(0, -big, big, 2 * big);
    if (CS.k > .001) {                                  // iki yarım daire: üstteki beyaz sola, alttaki siyah sağa taşar
      g.fillStyle = c.paper; g.beginPath(); g.ellipse(0, -R / 2, CS.k * R / 2, R / 2, 0, 0, TAU); g.fill();
      g.fillStyle = c.black; g.beginPath(); g.ellipse(0, R / 2, CS.k * R / 2, R / 2, 0, 0, TAU); g.fill();
    }
    if (CS.seed > .001) {
      g.fillStyle = c.black; g.beginPath(); g.arc(0, -R / 2, R * .12 * CS.seed, 0, TAU); g.fill();
      g.fillStyle = c.paper; g.beginPath(); g.arc(0, R / 2, R * .12 * CS.seed, 0, TAU); g.fill();
    }
    g.restore();
  },
  // Sayfadan çıkarken yüzük tohuma geri çekilir; now=true: anında temizle (başka bir yüzük geçişi başlıyor)
  stop(now) {
    if (RS.mode !== 'closing') return;
    if (this.tl) this.tl.kill();
    const end = () => {
      this.tl = null;
      RS.s = 0; RS.cy = 0; RS.mode = 'world';
      Ring.clear();
      if (this.g) this.g.clearRect(0, 0, W, H);
      fxCanvas.style.visibility = 'hidden';
    };
    if (now) end();
    else this.tl = gsap.to(RS, { s: 0, duration: .4, ease: 'power2.in', onUpdate: this.frame, onComplete: end });
  }
};

/* Yalnızca gösterim: yüzük ortanın üstünde belirir ve kendi ekseninde ağır ağır döner; zemine dokunmaz. */
const RingShow = {
  tw: [],
  play(delay) {
    Closing.stop(true);
    this.stop();
    RS.mode = 'show'; RS.invert = false; RS.s = 0; RS.th = 0; RS.tilt = .22; RS.cy = 1.02;
    this.tw = [gsap.to(RS, { s: .42, duration: 1.5, ease: 'back.out(1.5)', delay }),
               gsap.to(RS, { th: TAU, duration: 7, ease: 'none', repeat: -1, onUpdate: Ring.update })];
  },
  stop() {
    if (RS.mode !== 'show') return;
    this.tw.forEach(t => t.kill());
    RS.s = 0; RS.cy = 0; RS.mode = 'world';
    Ring.clear();
  }
};

/* =====================================================================
   18) GEZİNME — durum = (sayfa, adım). Adım: listede/tarifte açılan madde sayısı,
       reversed sayfada dünya (0 = A, 1 = B).
   ===================================================================== */
/* Silüet preset'leri: "crowd" | "solo:<dosya>" | "pair:<d1>,<d2>" | "none" → figür listesi.
   Ad klasörde yoksa önce CONFIG.silhouettes.alias'a, sonra en çok ortak sözcüğü olan dosyaya bakılır. */
function resolveSilhouette(name) {
  const files = Object.keys(FILES).filter(k => FILES[k].includes('silhouettes/')), c = CONFIG.silhouettes;
  name = name.trim();
  if (!files.length || files.includes(name)) return name;
  if (files.includes(c.alias[name])) return c.alias[name];
  const canon = t => ({ male: 'man', female: 'woman', walker: 'walking' }[t] || t), toks = n => n.split('-').map(canon), want = toks(name);
  let best = files[0], score = -1;
  for (const f of files) { const sc = toks(f).filter(t => want.includes(t)).length; if (sc > score) { score = sc; best = f; } }
  console.warn(`Silüet "${name}" bulunamadı; en yakın dosya kullanılıyor: ${best}`);
  return best;
}
function applyPreset(s, spec, layer, seed) {
  const c = CONFIG.silhouettes, obj = spec && typeof spec === 'object';
  // "pair:a,b"  ya da  { preset: 'pair', figures: ['a', { src: 'b', flip: true }] }
  const [kind, arg] = obj ? [spec.preset] : String(spec).split(':');
  const figs = (obj ? spec.figures || [] : (arg || '').split(',').filter(t => t.trim()))
    .map(f => (typeof f === 'string' ? { src: f } : f)).map(f => Object.assign({}, f, { src: resolveSilhouette(f.src) }));
  // faceRight: figür sağa mı baksın? Görselin bilinen yönü (facing) farklıysa yatay çevrilir.
  // Figürdeki flip:true bu sonucu bir kez daha çevirir (yönü bilinmeyen yan profiller için).
  const fig = (f, x, scale, faceRight) => ({ src: f.src, x: f.x || x, y: c.ground, scale: f.scale || scale, layer,
    flip: (!!c.facing[f.src] && (c.facing[f.src] === 'right') !== faceRight) !== !!f.flip });
  if (kind === 'crowd') s.crowds.push(Object.assign({ layer, seed }, c.crowd));
  else if (kind === 'solo' && figs[0]) {
    const x = s.nature === 'bonsai' ? c.solo.xBonsai : c.solo.x;
    s.silhouettes.push(fig(figs[0], x, c.solo.scale, false));
    s.horizons.push({ layer, y: c.ground, from: x - 330, to: s.nature === 'bonsai' ? x + 250 : 1790 });
  } else if (kind === 'pair' && figs.length > 1) {
    s.silhouettes.push(fig(figs[0], c.pair.x[0], c.pair.scale[0], true), fig(figs[1], c.pair.x[1], c.pair.scale[1], false));
    s.horizons.push({ layer, y: c.ground, from: c.pair.x[0] - 240, to: 1790 });
  } else if (kind !== 'none') console.warn(`Bilinmeyen silüet düzeni: ${JSON.stringify(spec)}`);
}
function expandSilhouettes(s, seed) {
  const spec = s.silhouettes;
  if (Array.isArray(spec)) return;                      // elle yerleşim: olduğu gibi
  s.silhouettes = [];
  s.crowds = (s.crowds || []).slice();
  s.horizons = (s.horizons || []).slice();
  if (s.type === 'reversed') {                          // A: kalabalık (beyaz) · B: yazılan düzen (siyah)
    applyPreset(s, s.silhouettesA || 'crowd', 'white', seed);
    applyPreset(s, spec || 'none', 'black', seed);
  } else if (spec) applyPreset(s, spec, s.world === 'light' ? 'black' : 'white', seed);
}

const SLIDES = [];
function normalizeSlides() {
  let section = '', no = 0;
  for (const raw of window.SLIDES || []) {
    const s = Object.assign({ world: 'dark' }, raw);
    if (!TYPES[s.type]) { console.warn(`Bilinmeyen sayfa tipi: ${s.type}`); s.text = s.text || s.title; s.type = 'statement'; }
    if (s.type === 'section') {                         // bölüm sayfası etiketi üretir
      if (s.number == null) s.number = pad2(++no);
      s.name = s.name || s.title || '';
      s.title = s.title || s.name;
      s.section = `${s.number} — ${s.name}`;
    }
    if (s.section) section = s.section; else s.section = section;
    expandSilhouettes(s, SLIDES.length + 3);
    SLIDES.push(s);
    if (s.type === 'tip' && s.reversed)                 // püf noktasının arkasından otomatik reversed sayfa
      SLIDES.push(Object.assign({ type: 'reversed', world: 'dark', section: s.section, title: s.title, notes: s.notes }, s.reversed));
  }
  SLIDES.forEach(s => { s._steps = TYPES[s.type].steps ? TYPES[s.type].steps(s) : 0; });
}
const worldAt = (s, step) => (s.type === 'reversed' ? (step ? B : A) : s.world === 'light' ? B : A);
function nextState(i, step) {
  if (step < SLIDES[i]._steps) return [i, step + 1];
  return i < SLIDES.length - 1 ? [i + 1, 0] : [i, step];
}
function prevState(i, step) {                           // geri: önce adımlar geri sarılır, sonra önceki sayfanın son hali
  if (step > 0) return [i, step - 1];
  return i > 0 ? [i - 1, SLIDES[i - 1]._steps] : [i, step];
}
const hashIndex = () => clamp((parseInt(location.hash.slice(1), 10) || 1) - 1, 0, SLIDES.length - 1);

const CUR = { i: -1, step: 0, s: null, els: [] };

/* =====================================================================
   METİN GÜVENLİ ALANI — rüzgâr izleri ve yapraklar metnin üstünden geçmez.
   Her sayfada görünen metin öğelerinin (başlık, alt başlık, madde, diyalog…) sınırları biraz
   genişletilerek toplanır. İzler bu alanlarda yumuşak kenarlı bir maskeyle silinir (alana girerken
   opaklık sıfıra iner); yapraklar alana yaklaşırken söner, öbür yanından yeniden belirir: metnin
   arkasından geçmiş olur. Metin katmanı (DOM) zaten tuvallerin üstündedir.
   ===================================================================== */
const SAFE_SEL = 'h1, p, li, blockquote, .kicker, .label, .stat, .foot, .meta';
function updateSafe() {
  if (PRESENTER || !layerW) return;
  const sr = stage.getBoundingClientRect(), k = stageScale, pad = CONFIG.safe.pad, range = document.createRange();
  for (const L of [layerW, layerB]) {
    const el = CUR.els.find(e => e._w === L.w), rects = [];
    if (el) el.querySelectorAll(SAFE_SEL).forEach(n => {
      if (n.closest('.igphone, .qr, .hanko, .m')) return;                    // kendi zemini olan bloklar
      const st = n.closest('[data-step]');
      if (st && !st._on) return;                                             // henüz açılmamış madde
      range.selectNodeContents(n);                                           // kutunun değil, yazının kapladığı alan
      const r = range.getBoundingClientRect();
      if (r.width < 4 || r.height < 4) return;
      rects.push({ l: (r.left - sr.left) / k - pad, t: (r.top - sr.top) / k - pad, r: (r.right - sr.left) / k + pad, b: (r.bottom - sr.top) / k + pad });
    });
    L.safe = rects;
    const m = L.mask || (L.mask = mkCanvas(W / 4, H / 4)), g = m.getContext('2d');
    g.clearRect(0, 0, m.width, m.height);
    if ('filter' in g) g.filter = `blur(${CONFIG.safe.soft / 4}px)`;
    for (const q of rects) g.fillRect(q.l / 4, q.t / 4, (q.r - q.l) / 4, (q.b - q.t) / 4);
  }
}
/* İçerik süzülerek geldiği için sınırlar giriş hareketi bitince bir kez daha ölçülür */
let safeTimers = [];
function scheduleSafe() {
  safeTimers.forEach(clearTimeout);
  safeTimers = [0, 700, 1500, 2800].map(ms => setTimeout(updateSafe, ms));
}
function safeFade(x, y, rects) {                        // 1: alanın dışında · 0: alanın içinde
  let f = 1;
  for (const q of rects) {
    const d = Math.max(q.l - x, x - q.r, q.t - y, y - q.b);
    if (d < 46) f = Math.min(f, smooth(-4, 46, d));
  }
  return f;
}


function go(i, step, o = {}) {
  i = clamp(i | 0, 0, SLIDES.length - 1);
  const s = SLIDES[i], T = TYPES[s.type];
  step = clamp(step | 0, 0, s._steps);
  if (S.busy) fastForward();
  if (i === CUR.i) {
    if (step === CUR.step) return;
    const turn = worldAt(s, step) !== worldAt(s, CUR.step);   // reversed: dünya değişiyorsa yüzük; yoksa yalnızca maddeler
    CUR.step = step;
    if (turn) ringTransition(step ? 'toB' : 'toA');
    CUR.els.forEach(el => applySteps(el, step, true));
  } else {
    const first = CUR.i < 0, from = S.world, target = worldAt(s, step), same = !first && target === from;
    const delay = first ? .25 : same ? .34 : .3;
    Closing.stop();
    RingShow.stop();
    // eski sayfa: görünen katmandaki içerik rüzgârla silinir; gizli katmandaki hemen kalkar
    for (const el of CUR.els) (!first && el._w === from ? windOut : destroy)(el);
    CUR.i = i; CUR.step = step; CUR.s = s;
    if (first) setWorld(target);
    S.target = target;
    setScene(s, target, first);
    CUR.els = (s.type === 'reversed' ? [A, B] : [target]).map(w => {
      const el = T.build(s, w, {});
      el._w = w;
      (w === A ? slidesW : slidesB).appendChild(el);
      fit(el);
      applySteps(el, step, false);
      windIn(el, delay);
      if (T.enter) T.enter(el, s, { delay });
      if (T.reveal && w === target) T.reveal(el);
      // reversed'in öbür yüzü, kaybolmakta olan zeminde bir an bile görünmesin
      if (!first && !same && w === from) { el.style.visibility = 'hidden'; S.pending.push(el); }
      return el;
    });
    if (!first && !same) blot(target, i);
    Enso.draw();
  }
  chrome();
  syncMedia();
  scheduleSafe();
  if (!o.remote) Sync.send({ t: 'state', i: CUR.i, step: CUR.step });
}

/* Üst/alt bilgi satırları, ilerleme çizgisi, URL */
const SEGMENTS = [];
function buildProgress() {
  const bar = $('#progress');
  SLIDES.forEach((s, i) => {
    const last = SEGMENTS[SEGMENTS.length - 1];
    if (last && last.label === s.section) last.n++;
    else SEGMENTS.push({ label: s.section, from: i, n: 1, el: bar.appendChild(h('i', null, h('b'))) });
  });
  SEGMENTS.forEach(g => g.el.style.setProperty('--n', g.n));
}
function chrome() {
  const s = CUR.s, n = SLIDES.length;
  document.title = `${s.title || s.type} — DinamİK`;
  stage.dataset.type = s.type;
  $('#top .section').textContent = s.section || '';
  $('#top .concept').textContent = s.title || '';
  $('#bottom .page').textContent = `${pad2(CUR.i + 1)} / ${pad2(n)}`;
  if (s.type === 'reversed') {
    $('#bottom .ia').textContent = (s.worldA || {}).label || 'Kitle İletişimi';
    $('#bottom .ib').textContent = (s.worldB || {}).label || 'Birebir İletişim';
  }
  SEGMENTS.forEach(g => g.el.style.setProperty('--p', clamp((CUR.i + 1 - g.from) / g.n, 0, 1)));
  if (location.hash !== '#' + (CUR.i + 1)) history.replaceState(null, '', '#' + (CUR.i + 1));
}
/* Videolar: sayfası ve dünyası görünürken oynar, aksi halde durur. Ses, ses düğmesine bağlıdır;
   tarayıcı sesli otomatik oynatmayı engellerse (ör. sayfa yenilendiğinde) sessiz başlar. */
function syncMedia() {
  for (const el of CUR.els) el.querySelectorAll('video').forEach(v => {
    if (el._w === S.target && !S.overview) {
      if (!v.paused) return;
      v.muted = !Sound.on;
      const p = v.play();
      if (p) p.catch(() => { v.muted = true; v.play().catch(() => {}); });
    } else v.pause();
  });
}

/* =====================================================================
   19) ÖNİZLEME IZGARASI (O) + SUNUCU GÖRÜNÜMÜ (N)
       Önizleme = aynı build() çıktısı, küçültülmüş sabit bir sahnede (hareketsiz).
       Sunucu görünümü aynı dosyadır (?presenter); pencereler BroadcastChannel ile
       (ve yedek olarak postMessage ile) aynı (sayfa, adım) durumunu paylaşır.
   ===================================================================== */
const RO = new ResizeObserver(es => es.forEach(e => e.target.style.setProperty('--k', e.contentRect.width / W)));
function makeThumb(i, step) {
  const s = SLIDES[i], w = worldAt(s, step), key = w === A ? 'white' : 'black';
  const cv = mkCanvas(W / 4, H / 4), g = cv.getContext('2d'), sc = sceneFor(s, key);
  g.scale(.25, .25);
  for (const f of sc.figs) {
    g.save();
    if (f.flip) { g.translate(2 * f.x, 0); g.scale(-1, 1); }
    g.drawImage(f.sp[key], f.x - f.w / 2, f.y - f.h, f.w, f.h);
    g.restore();
  }
  g.fillStyle = CONFIG.colors[key];
  for (const l of sc.lines) g.fillRect(l.from, l.y, l.to - l.from, 2);
  const el = TYPES[s.type].build(s, w, { thumb: true });
  applySteps(el, step, false);
  const t = h('div', 'thumb', h('div', 'mini world-' + (w === A ? 'dark' : 'light'), [cv, el]));
  RO.observe(t);
  return t;
}
const fullStep = s => (s.type === 'reversed' ? 0 : s._steps);   // önizlemede: tüm maddeler açık, reversed A yüzünde

const Overview = {
  el: $('#overview'),
  toggle(on = !S.overview) {
    const grid = $('.grid', this.el);
    S.overview = on;
    this.el.classList.toggle('open', on);
    RO.disconnect();
    grid.textContent = '';
    if (on) {
      SLIDES.forEach((s, i) => {
        const item = h('div', 'ov' + (i === CUR.i ? ' cur' : ''),
          [makeThumb(i, fullStep(s)), h('p', null, [h('span', null, pad2(i + 1)), h('span', null, s.title || s.type)])]);
        item.addEventListener('click', () => { this.toggle(false); go(i, 0); });
        grid.append(item);
      });
      grid.querySelectorAll('.mini').forEach(fit);
      const cur = $('.cur', grid);
      if (cur) cur.scrollIntoView({ block: 'center' });
    }
    syncMedia();
  }
};

const Sync = {
  bc: null, peer: null,
  init(onMsg) {
    try { this.bc = new BroadcastChannel('dinamik-sunum'); this.bc.onmessage = e => onMsg(e.data); } catch (e) {}
    addEventListener('message', e => { if (e.data && e.data.sunum) onMsg(e.data); });
  },
  send(m) {
    m.sunum = 1;
    try { if (this.bc) this.bc.postMessage(m); } catch (e) {}
    const p = this.peer || window.opener;                // aynı durum iki yoldan gelirse ikincisi etkisizdir
    try { if (p && !p.closed) p.postMessage(m, '*'); } catch (e) {}
  }
};

const Presenter = {
  i: 0, step: 0, t0: 0,
  open() {
    const url = location.href.split('#')[0].split('?')[0] + '?presenter#' + (CUR.i + 1);
    Sync.peer = window.open(url, 'dinamikSunucu', 'popup,width=1400,height=820');
  },
  init() {
    document.body.classList.add('presenter');
    document.title = 'Sunucu Görünümü — DinamİK';
    const root = this.root = h('div', null, null, { id: 'pv' });
    root.innerHTML =
      '<header><span class="pg"></span><span class="sec"></span><span class="stp"></span><span class="sp"></span>' +
      '<span class="clock"></span><button class="timer" title="Süreyi sıfırla">00:00</button></header>' +
      '<main><section class="cur"><label>Şimdi</label><div class="slot"></div></section>' +
      '<section class="next"><label>Sonraki sayfa</label><div class="slot"></div><label class="nl">Konuşmacı notları</label><div class="notes main"></div></section></main>' +
      '<footer><span>← → Space: gezin · R: dünyayı değiştir · G + sayı + Enter: sayfaya git · F: tam ekran</span>' +
      '<span><button class="prev">← Geri</button><button class="fwd">İleri →</button></span></footer>';
    document.body.append(root);
    $('.prev', root).onclick = () => Nav.prev();
    $('.fwd', root).onclick = () => Nav.next();
    $('.timer', root).onclick = () => { this.t0 = Date.now(); this.tick(); };
    this.t0 = Date.now();
    setInterval(() => this.tick(), 500);
    Sync.init(m => { if (m.t === 'state') this.set(m.i, m.step, true); });
    this.set(hashIndex(), 0, true);
    Sync.send({ t: 'hello' });                           // sahne penceresi güncel durumu yollar
  },
  tick() {
    const s = Math.floor((Date.now() - this.t0) / 1000), d = new Date();
    $('.timer', this.root).textContent = (s >= 3600 ? pad2(Math.floor(s / 3600)) + ':' : '') + pad2(Math.floor(s / 60) % 60) + ':' + pad2(s % 60);
    $('.clock', this.root).textContent = pad2(d.getHours()) + ':' + pad2(d.getMinutes());
  },
  set(i, step, remote) {
    i = clamp(i | 0, 0, SLIDES.length - 1);
    step = clamp(step | 0, 0, SLIDES[i]._steps);
    if (i === this.i && step === this.step && this.drawn) return;
    this.i = i; this.step = step; this.drawn = true;
    this.render();
    if (!remote) Sync.send({ t: 'state', i, step });
  },
  render() {
    const root = this.root, s = SLIDES[this.i], nx = SLIDES[this.i + 1], [a, b] = root.querySelectorAll('.slot');
    RO.disconnect();
    a.replaceChildren(makeThumb(this.i, this.step));
    b.replaceChildren(nx ? makeThumb(this.i + 1, fullStep(nx)) : h('div', 'notes', 'Son sayfa.'));
    root.querySelectorAll('.mini').forEach(fit);
    $('.pg', root).textContent = `${pad2(this.i + 1)} / ${pad2(SLIDES.length)}`;
    $('.sec', root).textContent = [s.section, s.title].filter(Boolean).join(' · ');
    $('.stp', root).textContent = s.type === 'reversed' ? (this.step ? 'Birebir (beyaz)' + (s._steps > 1 ? ` · ${this.step - 1} / ${s._steps - 1}` : '') : 'Kitle (siyah)')
      : s._steps ? `Adım ${this.step} / ${s._steps}` : '';
    $('.notes.main', root).textContent = s.notes || '—';
    history.replaceState(null, '', '#' + (this.i + 1));
  }
};

/* =====================================================================
   20) KONTROLLER
       → / Space / tıklama: ileri    ←: geri    R ya da yüzük düğmesi: reversed sayfada dünya değiştir
       F: tam ekran    O: önizleme ızgarası    N: sunucu görünümü    M: ses    G + sayı + Enter: sayfaya git
   ===================================================================== */
const Nav = {
  get i() { return PRESENTER ? Presenter.i : CUR.i; },
  get step() { return PRESENTER ? Presenter.step : CUR.step; },
  go(i, step) { if (PRESENTER) Presenter.set(i, step); else go(i, step); },
  next() { this.go(...nextState(this.i, this.step)); },
  prev() { this.go(...prevState(this.i, this.step)); },
  toggle() { const s = SLIDES[this.i]; if (s.type === 'reversed') this.go(this.i, this.step ? 0 : s._steps); }
};
let goBuf = null;                                       // "G" ile başlayan sayfa numarası girişi
function showHud(text) {
  const hud = $('#hud');
  hud.textContent = text;
  hud.style.display = text ? 'block' : 'none';
}
addEventListener('keydown', e => {
  if (e.ctrlKey || e.metaKey || e.altKey || !SLIDES.length) return;
  if (goBuf !== null) {
    e.preventDefault();
    if (/^\d$/.test(e.key)) goBuf = (goBuf + e.key).slice(0, 3);
    else if (e.key === 'Backspace') goBuf = goBuf.slice(0, -1);
    else {
      const n = e.key === 'Enter' ? +goBuf : 0;
      goBuf = null;
      showHud('');
      if (n) Nav.go(n - 1, 0);
      return;
    }
    showHud(`Sayfa ${goBuf || '…'} ↵`);
    return;
  }
  if (e.repeat) return;
  if (S.overview) { if (e.code === 'KeyO' || e.code === 'Escape') Overview.toggle(false); return; }
  switch (e.code) {
    case 'Space': case 'ArrowRight': case 'PageDown': e.preventDefault(); Nav.next(); break;
    case 'ArrowLeft': case 'PageUp': e.preventDefault(); Nav.prev(); break;
    case 'Home': Nav.go(0, 0); break;
    case 'End': Nav.go(SLIDES.length - 1, 0); break;
    case 'KeyR': Nav.toggle(); break;
    case 'KeyG': goBuf = ''; showHud('Sayfa … ↵'); break;
    case 'KeyF': if (document.fullscreenElement) document.exitFullscreen(); else document.documentElement.requestFullscreen(); break;
    case 'KeyM': if (!PRESENTER) Sound.toggle(); break;
    case 'KeyO': if (!PRESENTER) Overview.toggle(); break;
    case 'KeyN': if (!PRESENTER) Presenter.open(); break;
  }
});
stage.addEventListener('click', e => { if (!e.target.closest('button')) Nav.next(); });
// Butonlar odak tutmasın; yoksa Space hem butonu hem klavye kısayolunu tetikler
ringBtn.addEventListener('click', () => { ringBtn.blur(); Nav.toggle(); });
soundBtn.addEventListener('click', () => { soundBtn.blur(); Sound.toggle(); });

/* =====================================================================
   21) BAŞLAT
   ===================================================================== */
async function start() {
  applyConfig();
  normalizeSlides();
  if (!SLIDES.length) { const n = $('#nolib'); n.textContent = 'slides.js yüklenemedi ya da SLIDES dizisi boş.'; n.style.display = 'grid'; return; }
  makeInkMasks();
  if (PRESENTER) {                                      // sunucu görünümü: sahne, rüzgâr ve yüzük çalışmaz
    await loadAssets(false);
    Presenter.init();
    return;
  }
  Sound.init();
  makeWashi($('#washi'));
  makeSmoke();
  Enso.init();
  buildProgress();
  addEventListener('resize', fitStage);
  fitStage();
  gsap.set(ringBtn, { transformPerspective: 400 });

  await loadAssets(true);
  layerW = makeLayer($('#cvW'), 'white');
  layerB = makeLayer($('#cvB'), 'black');
  layerW.other = layerB; layerB.other = layerW;
  for (let i = 0; i < CONFIG.wind.free; i++) { const r = newRibbon(); spawnFree(r); r.age = rand(r.life * .6); FREE.push(r); }
  initLeaves();
  last = performance.now();
  requestAnimationFrame(loop);

  Sync.init(m => {
    if (m.t === 'hello') Sync.send({ t: 'state', i: CUR.i, step: CUR.step });
    else if (m.t === 'state') go(m.i, m.step, { remote: true });
  });
  go(hashIndex(), 0);
  addEventListener('hashchange', () => { const i = hashIndex(); if (i !== CUR.i) go(i, 0); });
  if (document.fonts && document.fonts.ready) document.fonts.ready.then(() => { CUR.els.forEach(fit); scheduleSafe(); });

  window.sunum = { go, Nav, S, CUR, SLIDES, CONFIG, Wind, stats: STATS };   // konsoldan erişim
}
if (window.gsap) start(); else document.getElementById('nolib').style.display = 'grid';
</script>
